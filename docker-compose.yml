x-backend-build: &backend-build ./server
x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://careerpilot:${POSTGRES_PASSWORD:?initialize a private environment file first}@postgres:5432/careerpilot
  API_TOKEN: ${API_TOKEN:?initialize a private environment file first}
  CAREERPILOT_SECRETS_KEY: ${CAREERPILOT_SECRETS_KEY:-}
  DEFAULT_WORKSPACE_SLUG: ${DEFAULT_WORKSPACE_SLUG:-personal}
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  PORTAL_TARGET_REPO: ${PORTAL_TARGET_REPO:-Lueyu/agent-interview}
  PORTAL_BASE_BRANCH: ${PORTAL_BASE_BRANCH:-master}
  PORTAL_CONTENT_DIR: ${PORTAL_CONTENT_DIR:-portal/content}
  PORTAL_AUTO_MERGE: ${PORTAL_AUTO_MERGE:-false}

services:
  preflight:
    build: *backend-build
    environment: *backend-environment
    command: ["python", "personal_credentials.py", "check"]

  postgres:
    image: postgres:16-alpine
    container_name: careerpilot-db
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?initialize a private environment file first}
      POSTGRES_DB: careerpilot
    depends_on:
      preflight:
        condition: service_completed_successfully
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_HOST_PORT:-127.0.0.1:5432}:5432"   # 默认只允许本机连接
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: *backend-build
    container_name: careerpilot-api
    volumes:
      - ./web/src/data/bank.json:/web/src/data/bank.json:ro
    environment:
      <<: *backend-environment
      FEEDBACK_TO: ${FEEDBACK_TO:-}
      FEEDBACK_SMTP_HOST: ${FEEDBACK_SMTP_HOST:-}
      FEEDBACK_SMTP_PORT: ${FEEDBACK_SMTP_PORT:-}
      FEEDBACK_SMTP_TLS: ${FEEDBACK_SMTP_TLS:-}
      FEEDBACK_SMTP_USERNAME: ${FEEDBACK_SMTP_USERNAME:-}
      FEEDBACK_SMTP_PASSWORD: ${FEEDBACK_SMTP_PASSWORD:-}
      FEEDBACK_SMTP_FROM: ${FEEDBACK_SMTP_FROM:-}
      FEEDBACK_REVIEW_BASE_URL: ${FEEDBACK_REVIEW_BASE_URL:-}
      FEEDBACK_REVIEW_MODEL: ${FEEDBACK_REVIEW_MODEL:-}
      FEEDBACK_REVIEW_API_KEY: ${FEEDBACK_REVIEW_API_KEY:-}
    ports:
      - "${API_HOST_PORT:-127.0.0.1:8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  worker:
    build: *backend-build
    container_name: careerpilot-worker
    environment: *backend-environment
    command: ["python", "-m", "app.project_worker"]
    # The API image completes bootstrap, migrations, and seed before serving /healthz.
    depends_on:
      server:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE: /api/v1
    container_name: careerpilot-web
    volumes:
      - ./web/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_HOST_PORT:-127.0.0.1:5173}:80"
    depends_on:
      - server

volumes:
  pgdata:
