<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI题库">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>AI Agent 面试题库 v2 · 一页一题</title>
<style>
  :root{
    --accent:#4f46e5; --accent-light:#eef2ff;
    --bg:#f7f8fb; --card:#ffffff; --text:#1f2430; --muted:#6b7280;
    --border:#e5e7eb; --radius:14px;
    --rose:#e11d48; --amber:#d97706; --teal:#0d9488; --slate:#475569;
    --rose-bg:#ffe4e6; --amber-bg:#fef3c7; --teal-bg:#ccfbf1; --term-bg:#e2e8f0;
    --topbar-bg:rgba(255,255,255,.92);
    --hover-bg:#fafafa; --soft:#f8fafc; --soft-border:#eef1f5;
    --strong:#111827; --text-soft:#334155;
    --note-bg:#fffbeb; --note-border:#fde68a; --note-fg:#92400e;
    --code-bg:#0f172a; --scroll-thumb:#d1d5db; --card-shadow:0 1px 3px rgba(15,23,42,.04);
    --code-inline-bg:#e9edf5; --code-inline-fg:#c7254e; --btn-on-accent:#ffffff;
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --accent:#8f96ff; --accent-light:#262c4f;
    --bg:#0e1016; --card:#161923; --text:#e3e6ee; --muted:#8a90a3;
    --border:#262b38;
    --rose:#fb7185; --amber:#fbbf24; --teal:#2dd4bf; --slate:#94a3b8;
    --rose-bg:#3b222c; --amber-bg:#3a2f18; --teal-bg:#123337; --term-bg:#262b38;
    --topbar-bg:rgba(17,19,27,.9);
    --hover-bg:#1d2230; --soft:#1b1f2b; --soft-border:#262b38;
    --strong:#f4f6fb; --text-soft:#bcc3d4;
    --note-bg:#2d2715; --note-border:#4a3d1a; --note-fg:#e3c473;
    --code-bg:#0d1119; --scroll-thumb:#343b4d; --card-shadow:none;
    --code-inline-bg:#232941; --code-inline-fg:#ff9ec4; --btn-on-accent:#141726;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.75;font-size:15.5px;overscroll-behavior-y:contain;touch-action:manipulation}
  body,.topbar,article.q,.usage,#sidenav{transition:background-color .3s ease,color .3s ease,border-color .3s ease}

  /* ===== 顶部进度条 & 导航栏 ===== */
  #progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#4f46e5,#a855f7);z-index:99;transition:width .1s}
  .topbar{position:sticky;top:0;z-index:50;background:var(--topbar-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .topbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
  .brand{font-weight:700;font-size:16px;white-space:nowrap;color:var(--accent)}
  .brand small{color:var(--muted);font-weight:400;margin-left:6px}
  #search{flex:1;max-width:430px;padding:8px 14px;border:1.5px solid var(--border);border-radius:999px;font-size:14px;outline:none;background:var(--card);color:var(--text);transition:border .2s}
  #search:focus{border-color:var(--accent)}
  #count{color:var(--muted);font-size:13px;white-space:nowrap}
  .btn-print,.btn-theme{padding:7px 14px;border:1.5px solid var(--border);border-radius:999px;background:var(--card);font-size:13px;cursor:pointer;color:var(--muted)}
  .btn-print:hover,.btn-theme:hover{border-color:var(--accent);color:var(--accent)}
  .btn-theme{display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;line-height:0}
  .btn-theme svg{display:block}
  .btn-theme .icon-sun{display:none}
  html[data-theme="dark"] .btn-theme .icon-sun{display:block}
  html[data-theme="dark"] .btn-theme .icon-moon{display:none}
  #btn-menu{display:none;padding:7px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;font-size:15px;color:var(--muted)}

  .layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:0;padding:0 20px}
  /* ===== 侧边栏 ===== */
  #sidenav{position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;padding:22px 14px 60px 0;border-right:1px solid var(--border);scrollbar-width:thin}
  #sidenav .nav-part{font-size:12px;font-weight:700;color:var(--accent);margin:16px 0 6px 10px;letter-spacing:.5px}
  #sidenav a{display:block;padding:4px 10px 4px 20px;color:var(--muted);text-decoration:none;font-size:12.8px;border-radius:8px;border-left:2px solid transparent;line-height:1.45}
  #sidenav a:hover{color:var(--text);background:var(--accent-light)}
  #sidenav a.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-light);font-weight:600}
  #sidenav::-webkit-scrollbar{width:5px}
  #sidenav::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:5px}

  /* ===== 主内容 ===== */
  main{padding:26px 0 100px 30px;min-width:0;max-width:900px}
  .hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#a855f7 100%);border-radius:20px;padding:34px 34px 30px;color:#fff;margin-bottom:30px;box-shadow:0 10px 30px rgba(79,70,229,.25)}
  .hero h1{font-size:26px;margin-bottom:8px}
  .hero p{opacity:.92;font-size:14.5px;margin-bottom:4px}
  .hero .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .hero .pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:3px 12px;border-radius:999px;font-size:12.5px}
  .usage{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 26px;margin-bottom:36px}
  .usage h2{font-size:17px;margin-bottom:12px;color:var(--accent)}
  .usage ol{padding-left:22px}
  .usage li{margin:7px 0;font-size:14.5px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .legend .badge{margin:0}

  .part-title{margin:52px 0 8px;font-size:22px;padding-bottom:12px;border-bottom:2px solid var(--accent);display:flex;align-items:baseline;gap:10px}
  .part-sub{color:var(--muted);font-size:13.5px;margin-bottom:26px}

  /* ===== 题目卡片 ===== */
  article.q{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px 22px;margin-bottom:26px;box-shadow:var(--card-shadow)}
  article.q.hide{display:none}
  .q-no{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:6px}
  .q h3{font-size:18.5px;line-height:1.5;margin-bottom:10px}
  .q-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px;font-size:12.5px}
  .q-meta .stars{color:#f59e0b;letter-spacing:1px}
  .tag{background:var(--accent-light);color:var(--accent);padding:1.5px 9px;border-radius:999px;font-size:12px}
  .company{color:var(--muted)}
  .block{border-left:3px solid var(--border);padding:2px 0 2px 16px;margin:16px 0}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;margin-bottom:8px;letter-spacing:.5px}
  .b-fast{background:var(--rose-bg);color:var(--rose)}
  .block.fast{border-color:var(--rose)}
  .b-ana{background:var(--amber-bg);color:var(--amber)}
  .block.ana{border-color:var(--amber)}
  .b-det{background:var(--accent-light);color:var(--accent)}
  .block.det{border-color:var(--accent)}
  .b-fol{background:var(--teal-bg);color:var(--teal)}
  .block.fol{border-color:var(--teal)}
  .b-term{background:var(--term-bg);color:var(--slate)}
  .block.term{border-color:var(--slate)}
  /* 块类型徽章图标(全站统一) */
  .b-fast::before{content:"🎤 ";margin-right:2px}
  .b-ana::before{content:"💡 ";margin-right:2px}
  .b-det::before{content:"🔍 ";margin-right:2px}
  .b-fol::before{content:"🎯 ";margin-right:2px}
  .b-term::before{content:"📚 ";margin-right:2px}
  .block p{margin:6px 0;font-size:14.8px}
  .block ul,.block ol{padding-left:22px;margin:8px 0}
  .block li{margin:5px 0;font-size:14.8px}
  .block b{color:var(--strong)}
  .block code,.qa code,.usage code,.term-item code{background:var(--code-inline-bg);color:var(--code-inline-fg);padding:1px 6px;border-radius:6px;font-family:Consolas,"Courier New",monospace;font-size:.92em}
  .note{background:var(--note-bg);border:1px solid var(--note-border);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:10px 0;color:var(--note-fg)}
  .arch{background:var(--code-bg);color:#e2e8f0;border-radius:10px;padding:14px 16px;font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.8;overflow-x:auto;margin:10px 0;white-space:pre}
  .arch .hl{color:#a5b4fc;font-weight:700}
  /* ===== SVG 架构图 ===== */
  .svgwrap{margin:14px 0;border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--card)}
  .sdiagram{display:block;max-width:100%;height:auto;overflow:visible;font-family:inherit}
  .sdiagram text{font-family:inherit}
  .sd-box{fill:var(--card);stroke:var(--accent);stroke-width:1.5}
  .sd-box2{fill:var(--soft);stroke:var(--border);stroke-width:1.3}
  .sd-box-teal{fill:var(--teal-bg);stroke:var(--teal);stroke-width:1.3}
  .sd-box-amber{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.3}
  .sd-box-rose{fill:var(--rose-bg);stroke:var(--rose);stroke-width:1.3}
  .sd-layer{fill:var(--accent-light);stroke:var(--accent);stroke-width:1;stroke-dasharray:5 4}
  .sd-t{fill:var(--text);font-size:12.5px;font-weight:600}
  .sd-ts{fill:var(--muted);font-size:10.5px}
  .sd-l{fill:var(--accent);font-size:10.5px;font-weight:700;letter-spacing:1px}
  .sd-a{stroke:#9aa0ae;stroke-width:1.6;fill:none}
  .sd-an{stroke:var(--teal);stroke-width:1.4;fill:none;stroke-dasharray:3 3}
  pre.code{background:var(--code-bg);color:#e2e8f0;border-radius:10px;padding:13px 16px;font-family:Consolas,monospace;font-size:13px;line-height:1.65;overflow-x:auto;margin:10px 0}
  pre.code .c{color:#94a3b8}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.6px}
  th{background:var(--accent-light);color:var(--accent);text-align:left;padding:8px 10px;font-size:13px}
  td{border-bottom:1px solid var(--border);padding:8px 10px;vertical-align:top}
  tr:hover td{background:var(--hover-bg)}
  details.qa{margin:8px 0;padding:10px 14px;background:var(--soft);border-radius:10px;border:1px solid var(--soft-border)}
  details.qa summary.qu{font-weight:700;color:var(--teal);font-size:14px;cursor:pointer;list-style:none;position:relative;padding-left:18px;user-select:none;-webkit-user-select:none}
  details.qa summary.qu::-webkit-details-marker{display:none}
  details.qa summary.qu::marker{display:none}
  details.qa summary.qu::before{content:'▸';position:absolute;left:0;top:0;color:var(--teal);transition:transform .18s ease;font-size:13px;line-height:1.6}
  details.qa[open] summary.qu::before{transform:rotate(90deg)}
  details.qa summary.qu:hover{color:var(--accent)}
  details.qa .an{font-size:14.3px;color:var(--text-soft);margin-top:8px}
  .fol-toggle{margin-left:10px;padding:2px 10px;border:1px solid var(--teal);border-radius:999px;background:transparent;color:var(--teal);font-size:11.5px;cursor:pointer;vertical-align:middle;transition:background .15s}
  .fol-toggle:hover{background:var(--teal-bg)}
  .terms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:8px}
  .term-item{background:var(--soft);border:1px solid var(--soft-border);border-radius:10px;padding:8px 12px;font-size:13.2px}
  .term-item b{color:var(--accent)}
  .top10 a{color:var(--accent);text-decoration:none;font-weight:600}
  .top10 a:hover{text-decoration:underline}
  footer{color:var(--muted);text-align:center;font-size:13px;padding:30px 0}

  #backtop{position:fixed;right:26px;bottom:calc(30px + env(safe-area-inset-bottom));width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);color:var(--btn-on-accent);font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(79,70,229,.4);opacity:0;pointer-events:none;transition:opacity .25s}
  #backtop.show{opacity:1;pointer-events:auto}
  #noresult{display:none;text-align:center;color:var(--muted);padding:60px 0;font-size:15px}
  /* ===== PWA:安全区与新版本提示 ===== */
  .topbar{padding-top:env(safe-area-inset-top)}
  .study-panel{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  #sidenav{padding-top:calc(20px + env(safe-area-inset-top))}
  .sync-menu{top:calc(52px + env(safe-area-inset-top))}
  #search-pop{top:calc(52px + env(safe-area-inset-top))}
  #sw-toast{position:fixed;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:90;background:var(--accent);color:var(--btn-on-accent);padding:10px 18px;border-radius:999px;font-size:13.5px;cursor:pointer;display:none;box-shadow:0 6px 20px rgba(79,70,229,.35);border:none;font-family:inherit}
  #sw-toast.show{display:block}

  @media (max-width:960px){
    .layout{grid-template-columns:1fr}
    #sidenav{position:fixed;left:0;top:0;height:100vh;height:100dvh;width:min(280px,84vw);background:var(--card);z-index:80;transform:translateX(-100%);transition:transform .25s;padding:20px 14px;box-shadow:2px 0 20px rgba(0,0,0,.12);overflow-y:auto}
    #sidenav.open{transform:translateX(0)}
    #btn-menu{display:block}
    main{padding-left:0}
    #view{padding-top:18px}
    .hero{padding:24px 18px}
    article.q{padding:18px 14px}
    .study-panel{padding:12px 12px 14px}
    #nav-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:75;display:none}
    #nav-backdrop.show{display:block}
  }
  @media (min-width:961px){#nav-backdrop{display:none!important}}
  @media (max-width:760px){
    .brand small{display:none}
    #count{display:none}
    /* SVG 架构图与表格保持可读:横向滑动查看 */
    .svgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .sdiagram{min-width:640px}
    .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tbl-scroll table{min-width:520px;margin:12px 0}
    /* iOS:输入控件聚焦避免自动放大 */
    .notebox,#search,.refine-row select{font-size:16px}
    .refine-row{flex-direction:column}
    .refine-row select{min-width:0;width:100%}
    .dq-item .t{white-space:normal}
  }
  @media (max-width:620px){
    .brand{display:none}
    #btn-print{display:none}
    #backtop{display:none}
    #sync-badge{display:none}
    #count{display:none}
    .topbar-inner{gap:8px;padding:9px 10px}
    #search{flex:1;font-size:14px;padding:8px 10px}
    #search::placeholder{font-size:12px}
    .qnav{gap:6px}
    .qnav button{padding:10px 14px;font-size:14px}
    .qpos{font-size:12px}
    /* 手机上只保留熟练度评分,隐藏笔记与改答案 */
    .notebox{display:none}
    .note-meta{display:none}
    .level-btns{gap:6px}
    .lv-btn{flex:1;padding:12px 0;font-size:14px;justify-content:center}
    .lv-btn .kbd{display:none}
    .study-panel{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
    .part-title{font-size:19px}
    .q h3{font-size:17px}
    .hero h1{font-size:22px}
    .terms-grid{grid-template-columns:1fr}
    .topic-card{padding:13px 14px}
    .topic-card .desc{min-height:0}
    .qrow{padding:10px 10px;gap:8px}
    .qrow .no{min-width:34px}
    .ring-wrap{padding:14px;gap:12px}
    .ring-wrap svg{width:96px;height:96px}
    .sync-menu{left:10px;right:10px;min-width:0;top:50px;transform:none}
    .empty{font-size:14px}
    .btn-line{gap:8px}
    .btn-main,.btn-ghost{padding:10px 14px;font-size:13px}
    .crumb{font-size:12px}
    .block{padding-left:12px;margin:14px 0}
  }
  @media print{
    :root,html[data-theme="dark"]{
      --accent:#4f46e5; --accent-light:#eef2ff;
      --bg:#fff; --card:#fff; --text:#1f2430; --muted:#6b7280; --border:#e5e7eb;
      --rose:#e11d48; --amber:#d97706; --teal:#0d9488; --slate:#475569;
      --rose-bg:#ffe4e6; --amber-bg:#fef3c7; --teal-bg:#ccfbf1; --term-bg:#e2e8f0;
      --hover-bg:#fff; --soft:#fff; --soft-border:#e5e7eb;
      --strong:#111827; --text-soft:#334155;
      --note-bg:#fffbeb; --note-border:#fde68a; --note-fg:#92400e;
      --code-inline-bg:#f1f1f1; --code-inline-fg:#c7254e;
      color-scheme:light;
    }
    .topbar,#sidenav,#backtop,#progress,#btn-menu{display:none!important}
    .qnav,.study-panel,.sync-menu,#search-pop{display:none!important}
    .layout{display:block;max-width:100%}
    main{padding:0;max-width:100%}
    article.q{break-inside:avoid;box-shadow:none}
    body{background:#fff;font-size:12px}
  }

/* ===== 应用层新增(v2) ===== */
.nav-count{float:right;color:var(--muted);font-size:11px}
.sync-badge{font-size:11.5px;padding:2px 10px;border-radius:999px;border:1px solid var(--border);cursor:pointer;white-space:nowrap;background:var(--card);color:var(--muted);font-family:inherit;line-height:1.4}
.sb-local{color:var(--amber);border-color:var(--amber)}
.sb-dirty{color:var(--amber);border-color:var(--amber)}
.sb-synced{color:var(--teal);border-color:var(--teal)}
.sb-error{color:var(--rose);border-color:var(--rose)}
.sb-pending{color:var(--accent);border-color:var(--accent)}
.sync-menu{position:fixed;top:52px;right:20px;z-index:60;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;display:none;box-shadow:0 8px 24px rgba(15,23,42,.12);min-width:190px}
.sync-menu.open{display:block}
.sync-menu button{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:none;color:var(--text);font-size:13px;border-radius:8px;cursor:pointer;font-family:inherit}
.sync-menu button:hover{background:var(--accent-light)}
.sync-menu .sep{height:1px;background:var(--border);margin:6px 0}
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--accent);text-decoration:none}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0}
.qnav button{padding:8px 16px;border:1.5px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;cursor:pointer;font-size:13.5px;font-family:inherit}
.qnav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.qnav button:disabled{opacity:.4;cursor:default}
.qpos{color:var(--muted);font-size:13px}
.study-panel{position:sticky;bottom:0;margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:0 -4px 20px rgba(15,23,42,.08)}
.level-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lv-btn{padding:7px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:13.5px;cursor:pointer;font-family:inherit}
.lv-btn.on-0{background:var(--term-bg);border-color:var(--slate);color:var(--slate)}
.lv-btn.on-1{background:var(--rose-bg);border-color:var(--rose);color:var(--rose)}
.lv-btn.on-2{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.lv-btn.on-3{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
.kbd{font-size:11px;color:var(--muted);opacity:.7}
.notebox{width:100%;min-height:96px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;line-height:1.7;resize:vertical;outline:none}
.notebox:focus{border-color:var(--accent)}

  .btn-ghost{padding:9px 18px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn-ghost:hover,.btn-main:hover:not(:disabled){opacity:.85}

<script>
(function(){
'use strict';
if(!window.QB || !Array.isArray(window.QB.questions) || !Array.isArray(window.QB.topics) || !window.QB.questions.length){
  document.getElementById('boot-error').style.display = 'block';
  return;
}
var QB = window.QB;
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function isoNow(){ return new Date().toISOString(); }
function nn(qid){ return parseInt(qid.split('-')[1], 10); }
var byId = {}, topicByCode = {}, byTopic = {};
QB.questions.forEach(function(q){ byId[q.id] = q; });
QB.topics.forEach(function(t){ topicByCode[t.code] = t; });
QB.questions.forEach(function(q){ (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
var TOTAL = QB.questions.length;
/* ---------- Store:localStorage 全量镜像 ---------- */
var LS_KEY = 'ib-notes-v2';
var Store = {
  data: { version: 1, updatedAt: null, last: null, items: {} },
  load: function(){
    try {
      var raw = localStorage.getItem(LS_KEY);
      if(!raw) return;
      var d = JSON.parse(raw);
      if(d && d.items && typeof d.items === 'object'){ d.last = d.last || null; d.version = d.version || 1; this.data = d; }
    } catch(e){}
  },
  persist: function(){
    this.data.updatedAt = isoNow();
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch(e){ if(window.console) console.warn('localStorage write failed:', e); }
    FileSync.onStoreChange();
  },
  item: function(qid){
    if(!this.data.items[qid]) this.data.items[qid] = { level: 0, note: '', updated: null, history: [] };
    return this.data.items[qid];
  },
  level: function(qid){
    var it = this.data.items[qid], l = it && it.level;
    return (typeof l === 'number' && l >= 0 && l <= 3) ? Math.floor(l) : 0;
  },
  setLevel: function(qid, level, mode){
    var it = this.item(qid);
    it.level = level; it.updated = isoNow();
    it.history.push({ t: isoNow(), mode: mode || 'manual', level: level });
    if(it.history.length > 60) it.history = it.history.slice(-60);
    this.persist();
  },
  setNote: function(qid, note){ var it = this.item(qid); if(it.note === note) return; it.note = note; it.updated = isoNow(); this.persist(); },
  visit: function(qid){ this.data.last = qid; this.persist(); },
  merge: function(other){
    var changed = false, a = this.data.items, b = (other && other.items) || {};
    Object.keys(b).forEach(function(k){
      var na = a[k] && a[k].updated, nb = b[k] && b[k].updated;
      if(!a[k] || (nb && (!na || na < nb))){ a[k] = b[k]; changed = true; }
    });
    if(other && other.last){ if(!this.data.last){ this.data.last = other.last; changed = true; } }
    return changed;
  }
};

/* ---------- FileSync:notes.json 直写(File System Access API) ---------- */
var FileSync = {
  available: ('showOpenFilePicker' in window),
  handle: null, status: 'off', timer: null, writing: false,
  setStatus: function(s){
    this.status = s;
    var b = $('#sync-badge'); if(!b) return;
    b.className = 'sync-badge' + (s === 'off' ? '' : ' sb-' + s);
    var tips = {
      off: '未连接笔记文件 · 点击连接 notes.json',
      local: '当前浏览器不支持文件直写 · 用导出/导入备份',
      synced: '笔记已同步到 notes.json',
      dirty: '改动将在 3 秒后写入 notes.json',
      error: '写入/读取失败 · 点击徽标打开菜单重试',
      pending: '正在连接…'
    };
    b.title = tips[s] || s;
    b.textContent = ({ off: '连接笔记', local: '本地模式', synced: '已同步', dirty: '未同步', error: '同步出错', pending: '连接中' })[s] || s;
  },
  idb: function(mode, k, v){
    return new Promise(function(res, rej){
      var rq = indexedDB.open('ib-notes', 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore('kv'); };
      rq.onerror = function(){ rej(rq.error); };
      rq.onsuccess = function(){
        var db = rq.result;
        try {
          var tx = db.transaction('kv', mode);
          var st = tx.objectStore('kv');
          var op = (mode === 'readonly') ? st.get(k) : st.put(v, k);
          op.onsuccess = function(){ res(op.result); };
          op.onerror = function(){ rej(op.error); };
        } catch(e){ rej(e); }
      };
    });
  },
  idbDelete: function(k){
    return new Promise(function(res, rej){
      var rq = indexedDB.open('ib-notes', 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore('kv'); };
      rq.onerror = function(){ rej(rq.error); };
      rq.onsuccess = function(){
        var db = rq.result;
        try {
          var tx = db.transaction('kv', 'readwrite');
          var st = tx.objectStore('kv');
          var op = st.delete(k);
          op.onsuccess = function(){ res(true); };
          op.onerror = function(){ rej(op.error); };
        } catch(e){ rej(e); }
      };
    });
  },
  forgetHandle: function(){
    this.handle = null;
    var self = this;
    this.idbDelete('notes-handle').catch(function(){});
  },
  connect: function(){
    var self = this;
    if(!this.available){ this.setStatus('local'); return; }
    this.setStatus('pending');
    var tryPicker = function(){
      showOpenFilePicker({ types: [{ description: '题库笔记', accept: { 'application/json': ['.json'] } }] })
        .then(function(arr){
          if(arr[0].name !== 'notes.json'){
            alert('请选择仓库根目录的 notes.json(当前选中的是 ' + arr[0].name + ')');
            var err = new Error('wrong file'); err.name = 'AbortError';
            throw err;
          }
          self.handle = arr[0];
          return self.idb('readwrite', 'notes-handle', arr[0]);
        })
        .then(function(){ return self.readMerge(); })
        .then(function(ok){ if(ok) self.setStatus('synced'); })
        .catch(function(e){ if(e && e.name === 'AbortError'){ self.handle = null; self.setStatus('off'); } else { self.setStatus('error'); } });
    };
    if(this.handle){
      this.handle.requestPermission({ mode: 'readwrite' }).then(function(p){
        if(p === 'granted'){ return self.readMerge().then(function(ok){ if(ok) self.setStatus('synced'); }); }
        tryPicker();
      }).catch(function(){ tryPicker(); });
    } else {
      this.idb('readonly', 'notes-handle', undefined).then(function(h){
        if(!h){ tryPicker(); return; }
        self.handle = h;
        return h.requestPermission({ mode: 'readwrite' }).then(function(p){
          if(p === 'granted'){ return self.readMerge().then(function(ok){ if(ok) self.setStatus('synced'); }); }
          tryPicker();
        });
      }).catch(function(){ tryPicker(); });
    }
  },
  autoAttach: function(){
    var self = this;
    if(!this.available){ this.setStatus('local'); return Promise.resolve('local'); }
    return this.idb('readonly', 'notes-handle', undefined)
      .then(function(h){
        if(!h){ self.setStatus('off'); return 'off'; }
        self.handle = h;
        return h.queryPermission({ mode: 'readwrite' }).then(function(p){
          if(p === 'granted'){ return self.readMerge().then(function(ok){ if(ok){ self.setStatus('synced'); } return self.status; }); }
          self.setStatus('off'); return 'off';
        });
      })
      .catch(function(){ self.setStatus('off'); return 'off'; });
  },
  readMerge: function(){
    var self = this;
    if(!this.handle) return Promise.resolve(false);
    return this.handle.getFile()
      .then(function(f){ return f.text(); })
      .then(function(txt){
        var d = {};
        try { d = txt ? JSON.parse(txt) : {}; }
        catch(e){ self.forgetHandle(); self.setStatus('error'); return false; }
        var changed = Store.merge(d);
        if(changed){ Store.persist(); refreshAfterStore(); }
        return true;
      })
      .catch(function(){ self.forgetHandle(); self.setStatus('error'); return false; });
  },
  onStoreChange: function(){
    if(!this.handle){ this.setStatus(this.available ? 'off' : 'local'); return; }
    this.setStatus('dirty');
    var self = this;
    clearTimeout(this.timer);
    this.timer = setTimeout(function(){ self.writeNow(); }, 3000);
  },
  writeNow: function(){
    var self = this;
    this.timer = null;
    if(!this.handle || this.writing) return;
    this.writing = true;
    this.handle.createWritable()
      .then(function(w){ return w.write(JSON.stringify(Store.data)).then(function(){ return w.close(); }); })
      .then(function(){ self.writing = false; self.setStatus('synced'); noteStatus(); })
      .catch(function(){ self.writing = false; self.setStatus('error'); });
  },
  flush: function(){
    if(this.timer){ clearTimeout(this.timer); this.timer = null; }
    if(this.handle && (this.status === 'dirty' || this.status === 'error')) this.writeNow();
  },
  export: function(){
    var blob = new Blob([JSON.stringify(Store.data)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'notes-export-' + Date.now() + '.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  },
  importFile: function(file){
    var self = this;
    file.text().then(function(txt){
      var d;
      try { d = JSON.parse(txt); } catch(e){ throw e; }
      if(!d || !d.items) throw new Error('bad');
      if(Store.merge(d)){ Store.persist(); refreshAfterStore(); self.setStatus(self.handle ? 'dirty' : 'local'); }
      else{ self.setStatus(self.handle ? 'synced' : 'local'); }
    }).catch(function(){ alert('导入失败:文件不是有效的 notes.json 备份'); });
  }
};

function buildNav(){
  var h = '<div class="nav-part">导航</div><a href="#/" data-nav="#/">仪表盘</a>'
        + (window.VAULT ? '<a href="#/vault" data-nav="#/vault">🔒 作战室仪表盘</a>' : '')
        + '<a href="#/refine" data-nav="#/refine">✂️ 答案投稿箱</a>'
        + '<a href="#/glossary" data-nav="#/glossary">📖 术语卡</a>'

function b64u(s){ var bin = atob(s), u = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function vaultDecrypt(pass, env){
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), { name: 'PBKDF2' }, false, ['deriveKey'])
    .then(function(km){
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64u(env.salt), iterations: env.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    })
    .then(function(key){ return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u(env.iv) }, key, b64u(env.ct)); })
    .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
}
function vaultRadar(m){
  var R = 100, C = 130, N = QB.topics.length, i, pt = [];
  var mx = 100;
  for(i = 0; i < N; i++){
    var a = -Math.PI / 2 + i * 2 * Math.PI / N;
    var sc = (m[QB.topics[i].code] && typeof m[QB.topics[i].code].score === 'number') ? m[QB.topics[i].code].score : 0;
    pt.push((C + R * sc / mx * Math.cos(a)).toFixed(1) + ',' + (C + R * sc / mx * Math.sin(a)).toFixed(1));
  }
  var axes = '';
  for(i = 0; i < N; i++){
    var a2 = -Math.PI / 2 + i * 2 * Math.PI / N;
    var x1 = C + R * Math.cos(a2), y1 = C + R * Math.sin(a2);
    var x2 = C + (R + 16) * Math.cos(a2), y2 = C + (R + 16) * Math.sin(a2);
    axes += '<line x1="' + C + '" y1="' + C + '" x2="' + x1.toFixed(1) + '" y2="' + y1.toFixed(1) + '" stroke="var(--border)"/>'
      + '<text x="' + x2.toFixed(1) + '" y="' + y2.toFixed(1) + '" font-size="11" fill="var(--muted)" text-anchor="middle">' + QB.topics[i].code + '</text>';
  }
  return '<svg width="260" height="260" viewBox="0 0 260 260">' + axes
    + '<polygon points="' + pt.join(' ') + '" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/></svg>';
}
function renderVault(){
  if(!window.VAULT){

    return;
  }
  view.innerHTML = '<div class="crumb"><a href="#/">仪表盘</a> › 🔒 作战室仪表盘</div>'
    + '<section class="hero"><h1>🔒 作战室仪表盘</h1><p>每日 08:30 自动更新 · AES-256-GCM 端到端加密</p></section>'
    + '<div style="max-width:420px;margin:14px auto;text-align:center">'
    + '<input id="vault-pass" type="password" placeholder="输入口令" style="width:220px;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:14px">'

  var go = function(){

function buildTopicList(code, filter){
  var qs = (byTopic[code] || []).slice();
  if(filter === 'unseen') qs = qs.filter(function(q){ return Store.level(q.id) === 0; });
  else if(filter === 'seen') qs = qs.filter(function(q){ return Store.level(q.id) > 0; });
  else if(filter !== 'all') qs = qs.filter(function(q){ return Store.level(q.id) === +filter; });
  qs.sort(function(a, b){ return nn(a.id) - nn(b.id); });
  var row = $('#qlist'); if(!row) return;
  row.innerHTML = qs.length ? '' : '<div class="empty">该筛选下没有题目</div>';
  qs.forEach(function(q){
    var lv = Store.level(q.id);
    var a = el('a', 'qrow');
    a.href = '#/q/' + q.id;
    a.innerHTML = '<span class="no">' + ('' + nn(q.id)).padStart(3, '0') + '</span>'
                + '<span class="t">' + esc(q.title) + '</span>'

                + '<span class="lvdot lv' + lv + '"></span>';

}

        + '<div class="note-meta"><span>←/→ 切题 · 数字键 1-4 · <a style="color:var(--accent)" href="#/refine/' + q.id + '">改答案</a></span><span id="note-status"></span></div></div>';

function bindStudyPanel(q){
  $('#level-btns').addEventListener('click', function(e){
    var b = e.target.closest('.lv-btn'); if(!b) return;
    setLevelUI(q, +b.getAttribute('data-lv'), 'manual');
  });
  var box = $('#notebox');
  box.addEventListener('input', function(){
    if(pendingNote && pendingNote.box !== box) flushNote();
    clearTimeout(pendingNote ? pendingNote.timer : null);
    var timer = setTimeout(function(){
      Store.setNote(q.id, box.value); noteStatus();
      if(pendingNote && pendingNote.box === box) pendingNote = null;
    }, 400);
    pendingNote = { qid: q.id, box: box, timer: timer };
  });
  window.__ibKeyHandler = function(e){
    if(e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if(e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
    if(e.key === 'ArrowLeft'){ var p = $('#btn-prev'); if(p && !p.disabled) p.click(); }
    else if(e.key === 'ArrowRight'){ var nx = $('#btn-next'); if(nx && !nx.disabled) nx.click(); }
    else if(e.key >= '1' && e.key <= '4'){ setLevelUI(q, +e.key - 1, 'key'); }
  };
  noteStatus();
}

function setLevelUI(q, lv, mode){
  Store.setLevel(q.id, lv, mode);
  $$('#level-btns .lv-btn').forEach(function(b, i){
    b.className = 'lv-btn' + (i === lv ? ' on-' + lv : '');
  });
  noteStatus(); refreshNav();
}

var DraftFS = {
  available: ('showDirectoryPicker' in window),
  root: null, drafts: null,
  connect: function(){
    var self = this;
    if(!this.available) return Promise.resolve(false);
    return showDirectoryPicker({ mode: 'readwrite' }).then(function(dir){
      self.root = dir;
      return dir.getDirectoryHandle('drafts', { create: true }).then(function(d){
        self.drafts = d;
        return FileSync.idb('readwrite', 'drafts-dir', dir);
      });
    });
  },
  autoAttach: function(){
    var self = this;
    if(!this.available) return Promise.resolve(false);
    return FileSync.idb('readonly', 'drafts-dir', undefined).then(function(h){
      if(!h) return false;
      return h.queryPermission({ mode: 'readwrite' }).then(function(p){
        if(p !== 'granted') return false;
        self.root = h;
        return h.getDirectoryHandle('drafts', { create: true }).then(function(d){
          self.drafts = d; return true;
        });
      });
    }).catch(function(){ return false; });
  },
  saveAll: function(){
    var self = this;
    if(!this.drafts) return Promise.reject(new Error('no drafts dir'));
    return Promise.all(draftQueue.map(function(item){
      return self.drafts.getFileHandle(item.qid + '.txt', { create: true }).then(function(fh){
        return fh.createWritable().then(function(w){
          return w.write(item.text).then(function(){ return w.close(); });
        });
      });
    })).then(function(r){ return r.length; });
  },
  download: function(item){
    var blob = new Blob([item.text], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = item.qid + '.txt';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }
};

function renderRefine(qid){
  var h = '<div class="crumb"><a href="#/">仪表盘</a> › 答案投稿箱</div>'
        + '<h2 class="part-title">✂️ 答案投稿箱<span style="font-size:14px;color:var(--muted);font-weight:400">网页粘贴 → 存入 drafts/ → 对 opencode 说「处理草稿」</span></h2>'
        + '<p class="part-sub">把别家 AI 给你的更好回答粘贴进来,批量存入本地草稿箱(drafts/ 目录,已 gitignore 不入库),然后回到 opencode 触发 refine-answer skill 全量重写题卡。</p>'
        + '<div class="refine-panel">'
        + '<div class="refine-hint">① 选题 → ② 粘贴新答案 → ③ 加入队列(可重复多题)→ ④ 保存到草稿箱</div>'
        + '<div class="refine-row"><select id="rf-topic" aria-label="主题"></select><select id="rf-q" aria-label="题目"></select></div>'
        + '<textarea class="notebox" id="rf-text" style="min-height:150px" placeholder="粘贴这道题的新答案(任意 AI 的原始输出,不用整理格式)…"></textarea>'
        + '<div class="btn-line">'
        + '<button class="btn-ghost" id="rf-add">加入队列</button>'
        + '<button class="btn-main" id="rf-save">保存到草稿箱(0)</button>'
        + '<button class="btn-ghost" id="rf-conn">连接仓库目录</button>'
        + '</div>'
        + '<div class="refine-status" id="rf-status"></div>'
        + '<div class="draft-queue" id="rf-queue"></div>'
        + '</div>';
  view.innerHTML = h;
  var topicSel = $('#rf-topic'), qSel = $('#rf-q');
  topicSel.innerHTML = QB.topics.map(function(t){
    return '<option value="' + t.code + '">' + t.icon + ' ' + esc(t.name) + '</option>';
  }).join('');
  function fillQ(code, wantId){
    var qs = (byTopic[code] || []).slice().sort(function(a, b){ return nn(a.id) - nn(b.id); });
    qSel.innerHTML = qs.map(function(q){
      return '<option value="' + q.id + '">' + q.id + ' · ' + esc(q.title) + '</option>';
    }).join('');
    if(wantId && byId[wantId]) qSel.value = wantId;
  }
  topicSel.addEventListener('change', function(){ fillQ(topicSel.value); });
  var preset = (qid && byId[qid]) ? byId[qid].topic
             : (draftQueue.length && byId[draftQueue[draftQueue.length - 1].qid] ? byId[draftQueue[draftQueue.length - 1].qid].topic : 'rag');
  topicSel.value = preset;
  fillQ(preset, qid);
  renderDraftQueue();
  $('#rf-add').onclick = function(){
    var target = qSel.value, text = $('#rf-text').value.trim();
    if(!text){ $('#rf-status').textContent = '先粘贴新答案,再加入队列。'; return; }
    draftQueue.push({ qid: target, text: text });
    saveDraftQueue();
    $('#rf-text').value = '';
    $('#rf-status').textContent = '已入队:' + target + '(可继续选下一题粘贴)';
    renderDraftQueue();
  };
  $('#rf-conn').onclick = function(){
    if(!DraftFS.available){ $('#rf-status').textContent = '当前浏览器不支持目录直写:保存时会逐个下载文件,手动放入仓库 drafts/ 目录即可。'; return; }
    $('#rf-status').textContent = '连接中…';
    DraftFS.connect().then(function(){
      $('#rf-status').textContent = DraftFS.drafts ? '已连接仓库目录,drafts/ 就绪。' : '连接已取消。';
    }).catch(function(){
      $('#rf-status').textContent = '连接失败,可重试;或直接保存走下载兜底。';
    });
  };
  $('#rf-save').onclick = function(){
    if(!draftQueue.length) return;
    if(!DraftFS.available){
      draftQueue.forEach(function(it){ DraftFS.download(it); });
      $('#rf-status').textContent = '已下载 ' + draftQueue.length + ' 个草稿文件,请移入仓库 drafts/ 目录后对 opencode 说「处理草稿」。';
      draftQueue = []; saveDraftQueue(); renderDraftQueue();
      return;
    }
    var go = function(){
      DraftFS.saveAll().then(function(n){
        draftQueue = []; saveDraftQueue(); renderDraftQueue();
        $('#rf-status').innerHTML = '已写入 drafts/ 共 <b>' + n + '</b> 个草稿。现在回到 opencode,说<b>「处理草稿」</b>即可批量重写题卡。';
      }).catch(function(){
        $('#rf-status').textContent = '写入失败:请确认选中的是仓库根目录(会自动建 drafts/),或点「连接仓库目录」重试。';
      });
    };
    if(DraftFS.drafts) go();
    else DraftFS.connect().then(go, go);
  };
  DraftFS.autoAttach().then(function(ok){
    if(ok) $('#rf-status').textContent = '已自动连接仓库目录,drafts/ 就绪。';
  });
}
function renderDraftQueue(){
  var box = $('#rf-queue'); if(!box) return;
  var btn = $('#rf-save');
  if(btn){ btn.textContent = '保存到草稿箱(' + draftQueue.length + ')'; btn.disabled = !draftQueue.length; }
  box.innerHTML = draftQueue.length ? '' : '<div class="empty" style="padding:10px 0;font-size:13px">队列为空</div>';
  draftQueue.forEach(function(it, i){
    var d = el('div', 'dq-item',
      '<span class="no">' + esc(it.qid) + '</span><span class="t">' + esc((it.text || '').slice(0, 60)) + '…</span>');
    var b = el('button', null, '移除');
    b.onclick = function(){ draftQueue.splice(i, 1); saveDraftQueue(); renderDraftQueue(); };
    d.appendChild(b);
    box.appendChild(d);
  });
}
/* ---------- 术语卡 ---------- */
function renderGlossaryCard(g){
  var c = el('div', 'gl-card');
  c.appendChild(el('h3', 'gl-term-title',
    esc(g.term) + '<span class="gl-term-en">' + esc(g.en) + '</span>'));

  c.appendChild(el('div', 'gl-detail', esc(g.detail)));

  (g.links || []).forEach(function(u){
    var a = el('a', null, esc(u));
    a.href = u; a.target = '_blank'; a.rel = 'noopener';
    links.appendChild(a);
  });
  c.appendChild(links);
  return c;
}
function renderGlossaryList(){
  var grid = $('#gl-grid'); if(!grid) return;
  var kw = ($('#gl-search') ? $('#gl-search').value : '').trim().toLowerCase();
  var list = (QB.glossary || []).filter(function(g){
    if(!kw) return true;
    return (g.term + ' ' + g.en + ' ' + g.one_liner).toLowerCase().indexOf(kw) !== -1;
  });
  grid.innerHTML = '';
  if(!list.length){
    grid.appendChild(el('div', 'gl-empty', '没有匹配的术语,换个关键词试试'));
    return;
  }
  list.forEach(function(g){ grid.appendChild(renderGlossaryCard(g)); });
}

/* ---------- 路由 ---------- */
var view = $('#view');
function route(){
  window.__ibKeyHandler = null;
  FileSync.flush();
  flushNote();
  var h = location.hash || '#/';
  if(h === '#/' || h === '#' || h === '') renderHome();
  else if(h.indexOf('#/topic/') === 0) renderTopic(h.slice('#/topic/'.length));
  else if(h.indexOf('#/q/') === 0) renderQuestion(h.slice('#/q/'.length));
  else if(h === '#/vault') renderVault();
  else if(h === '#/glossary') renderGlossary();
  else if(h === '#/top10') renderTop10();
  else if(h === '#/refine' || h.indexOf('#/refine/') === 0)
    renderRefine(h.indexOf('#/refine/') === 0 ? h.slice('#/refine/'.length) : '');
  else render404();
  setActiveNav(h);
  window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
  updateProgress();
}
/* ---------- 公共 ---------- */
function refreshAfterStore(){
  refreshNav();
  var h = location.hash || '#/';
  if(h === '#/' || h === '#' || h === ''){ renderHome(); return; }
  if(h.indexOf('#/topic/') === 0){
    $$('#qlist .qrow').forEach(function(r){
      var id = (r.getAttribute('href') || '').split('/q/')[1];
      if(!id || !byId[id]) return;
      var dot = r.querySelector('.lvdot');
      if(dot) dot.className = 'lvdot lv' + Store.level(id);
    });
    return;
  }
  var mq = h.match(/^#\/q\/([\w-]+)$/);
  if(mq && byId[mq[1]]){
    var q = byId[mq[1]];
    var lv0 = Store.level(q.id);
    $$('#level-btns .lv-btn').forEach(function(b, i){
      b.className = 'lv-btn' + (i === lv0 ? ' on-' + lv0 : '');
    });
    noteStatus();
  }
}
function updateProgress(){
  var d = document.documentElement;
  var p = (d.scrollTop / Math.max(1, d.scrollHeight - d.clientHeight)) * 100;
  $('#progress').style.width = p + '%';
  $('#backtop').classList.toggle('show', d.scrollTop > 600);
}
function refreshCount(n){ $('#count').textContent = n + ' / ' + TOTAL + ' 题'; }

/* ---------- 启动 ---------- */
Store.load();
buildNav();
route();
refreshCount(TOTAL);
$('#brand-meta').textContent = TOTAL + '题 · ' + QB.topics.length + '主题 · 一页一题';
FileSync.autoAttach();
window.addEventListener('storage', function(e){
  if(e.key === LS_KEY && e.newValue){
    try {
      if(Store.merge(JSON.parse(e.newValue))){ refreshAfterStore(); }
    } catch(err){}
  }
});
$('#btn-theme').onclick = function(){
  var r = document.documentElement;
  var toDark = r.getAttribute('data-theme') !== 'dark';
  if(toDark) r.setAttribute('data-theme', 'dark'); else r.removeAttribute('data-theme');
  try { localStorage.setItem('ib-theme', toDark ? 'dark' : 'light'); } catch(e){}
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', toDark ? '#0e1016' : '#f7f8fb');
};
$('#btn-print').onclick = function(){ window.print(); };
$('#backtop').onclick = function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); };
$('#btn-menu').onclick = function(){
  $('#sidenav').classList.toggle('open');
  $('#nav-backdrop').classList.toggle('show', $('#sidenav').classList.contains('open'));
};

  $('#nav-backdrop').classList.remove('show');
};

    $('#sidenav').classList.remove('open');

document.addEventListener('keydown', function(e){ if(window.__ibKeyHandler) window.__ibKeyHandler(e); });

/* ---------- PWA:触屏滑动切题(题目页) ---------- */
(function(){
  var sx = 0, sy = 0, target = null;
  document.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    target = e.target;
  }, { passive: true });
  document.addEventListener('touchend', function(e){
    if(target === null) return;
    var blocked = target.closest && target.closest(
      '.tbl-scroll, .svgwrap, .notebox, textarea, input, select, .qnav, pre.code');
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    target = null;
    if(blocked) return;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2) return;
    var mq = (location.hash || '').match(/^#\/q\/([\w-]+)$/);
    if(!mq || !byId[mq[1]]) return;
    var q = byId[mq[1]];
    var qs = byTopic[q.topic];
    var i = qs.indexOf(q);
    if(dx < 0 && i < qs.length - 1) location.hash = '#/q/' + qs[i + 1].id;
    else if(dx > 0 && i > 0) location.hash = '#/q/' + qs[i - 1].id;
  }, { passive: true });
})();

/* ---------- PWA:Service Worker 注册与新版本提示 ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange', function(){
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          var toast = $('#sw-toast');
          toast.textContent = '新版本已就绪,点击刷新';
          toast.classList.add('show');
        }
      });
    });
  }).catch(function(){ /* SW 不可用(如 http 环境)时静默 */ });
  $('#sw-toast').onclick = function(){ location.reload(); };
}

/* ---------- 同步菜单 ---------- */
var menu = $('#sync-menu');
$('#sync-badge').onclick = function(e){ e.stopPropagation(); pop.classList.remove('open'); menu.classList.toggle('open'); };
document.addEventListener('click', function(e){
  if(!e.target.closest('#sync-menu') && e.target !== $('#sync-badge')) menu.classList.remove('open');
});
menu.addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  menu.classList.remove('open');
  var a = b.getAttribute('data-a');
  if(a === 'connect') FileSync.connect();
  else if(a === 'write') FileSync.writeNow();
  else if(a === 'export') FileSync.export();
  else if(a === 'import') $('#file-import').click();
});
$('#file-import').addEventListener('change', function(){
  if(this.files && this.files[0]) FileSync.importFile(this.files[0]);
  this.value = '';
});

/* ---------- 调试/测试句柄(受控暴露) ---------- */
window.__ib = { Store: Store, FileSync: FileSync, refresh: refreshAfterStore, DraftFS: DraftFS, draftQueue: function(){ return draftQueue; } };

/* ---------- 全局搜索 ---------- */
var pop = $('#search-pop');
$('#search').addEventListener('input', function(){
  var kw = this.value.trim().toLowerCase();
  if(!kw){ pop.classList.remove('open'); pop.innerHTML = ''; refreshCount(TOTAL); return; }
  var matched = QB.questions.filter(function(q){
    return (q.title + ' ' + q.kw + ' ' + q.source + ' ' + q.id).toLowerCase().indexOf(kw) !== -1;
  });
  var hits = matched.slice(0, 20);
  pop.innerHTML = hits.length ? '' : '<div class="empty" style="padding:18px 0">没有匹配的题目</div>';
  hits.forEach(function(q){
    var a = el('a', 'sr-item');
    a.href = '#/q/' + q.id;
    a.innerHTML = '<small>' + q.id + '</small>' + esc(q.title);
    pop.appendChild(a);
  });
  if(matched.length > hits.length){
    var foot = el('div', 'empty', '共 ' + matched.length + ' 条,显示前 20 条');
    foot.setAttribute('style', 'padding:10px 0;font-size:12px');
    pop.appendChild(foot);
  }
  pop.classList.add('open');
  refreshCount(matched.length);
});
pop.addEventListener('click', function(e){
  if(e.target.closest('a')){ pop.classList.remove('open'); $('#search').value = ''; refreshCount(TOTAL); }
});
document.addEventListener('click', function(e){
  if(!e.target.closest('#search-pop') && e.target !== $('#search')) pop.classList.remove('open');
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(pop.classList.contains('open')){
      pop.classList.remove('open');
      $('#search').value = '';
      refreshCount(TOTAL);
    }
    menu.classList.remove('open');
    $('#sidenav').classList.remove('open');
    $('#nav-backdrop').classList.remove('show');
  }
});
})();
