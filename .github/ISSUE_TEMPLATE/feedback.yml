name: 使用反馈
description: 提交题库纠错、界面建议或求职学习体验反馈
body:
  - type: markdown
    attributes:
      value: Issue 是公开的。请使用公开题或虚构例子。请移除简历、个人作答、账号信息、模型密钥、连接串和私有仓库内容。
  - type: input
    id: location
    attributes:
      label: 页面或公开题（选填）
      placeholder: 题库、学习笔记，或公开题的标题
  - type: textarea
    id: feedback
    attributes:
      label: 你的反馈
      description: 说说你想完成什么、哪一步有困难，以及你建议怎么改。纠错可附公开来源。
    validations:
      required: true
