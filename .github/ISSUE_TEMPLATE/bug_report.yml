name: 问题报告
description: 报告可以复现的错误
body:
  - type: markdown
    attributes:
      value: Issue 是公开的。请用虚构数据或公开题复现。只贴脱敏后的错误片段或截图，发布前移除密钥、个人记录和私有路径。
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 写出页面路径和操作顺序。用公开题标题或虚构输入代替个人数据。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际结果和预期结果
      description: 描述你看到了什么，以及你期待发生什么。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本与环境（选填）
      placeholder: 应用版本或公开提交号、浏览器和操作系统
