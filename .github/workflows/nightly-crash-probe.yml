# Opt-in nightly crash probe — KNOWN_ISSUES F3 (wave 0-A).
#
# study_chat_crash_probe.py is intentionally NOT collected by the default
# `pytest tests` run: it kills and restarts a real API process against a shared
# database and requires an explicit isolated *_test URL on loopback (see the
# skipif in that file). Run it through run_isolated_tests.py so the same
# fresh-database discipline applies.
#
# Scheduled workflows run only on the repository default branch; use
# workflow_dispatch to trigger the probe on any other ref.
# cron 17 18 * * * = 18:17 UTC = 02:17 Asia/Shanghai.

name: Nightly crash probe

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-crash-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crash-probe:
    name: Study chat crash probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql+asyncpg://careerpilot:careerpilot_dev@localhost:5432/postgres
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run crash probe
        env:
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          GITHUB_TOKEN: ""
        run: python run_isolated_tests.py tests/study_chat_crash_probe.py -q -s --tb=short
