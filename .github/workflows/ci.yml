# CareerPilot CI gate — KNOWN_ISSUES F3 (wave 0-A).
#
# Graded gate, 2026-11-27:
#   REQUIRED   backend isolated pytest over the currently-green suite only;
#              frontend node --test, typecheck, build. Only checks verified
#              green on current dev are made required. The exact exclusions,
#              their evidence and the follow-up cleanup item are recorded in
#              .github/workflows/known-red-backend-baseline.md.
#   ADVISORY   backend full suite (non-blocking, publishes its exit code);
#              ruff / eslint / knip. Known-red baselines run on every PR,
#              publish exit codes to the job summary and never block.
#              Cleanup is a separate item; do not bulk `--fix` or reformat here
#              (server/pyproject.toml treats style churn as independent work
#              because it breaks line references across the codebase).
#   TIMEZONE   both backend jobs pin TZ: Asia/Shanghai. app/api/v1/learning.py
#              schedules retests on a fixed UTC+8 date while tests and
#              app/api/v1/exams.py use date.today(); an unpinned UTC runner makes
#              the required gate depend on the time of day. See the baseline doc.
#   CONTRACT   .github/workflows/tests/test_ci_gate.py asserts this grading is
#              preserved, so a future edit cannot silently relax the gate.
#   NIGHTLY    nightly-crash-probe.yml runs the opt-in study_chat_crash_probe.py
#              (deliberately not collected by the default `pytest tests`).
#
# Safety: no personal database and no credentials. run_isolated_tests.py creates
# a fresh *_test database on the ephemeral PG service container; conftest.py
# clears LLM/GitHub credentials inside the test process. This workflow injects
# nothing but local development placeholders.

name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · isolated pytest (currently-green gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://careerpilot:careerpilot_dev@localhost:5432/postgres
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Isolated backend tests (currently-green gate)
        env:
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          GITHUB_TOKEN: ""
          PORTAL_AUTO_MERGE: "false"
        run: |
          python run_isolated_tests.py tests -q --tb=short \
            --ignore=tests/test_bank_review_actions.py \
            --ignore=tests/test_learning_feedback_processes.py \
            --ignore=tests/test_standalone_ops_study_chat.py \
            --ignore=tests/test_study_routing.py \
            --ignore=tests/test_local_safety.py \
            --ignore=tests/test_podcast_content.py

  backend-full-suite:
    name: Backend · full suite advisory (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://careerpilot:careerpilot_dev@localhost:5432/postgres
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Full backend suite advisory
        env:
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          GITHUB_TOKEN: ""
          PORTAL_AUTO_MERGE: "false"
        run: |
          set +e
          python run_isolated_tests.py tests -q --tb=short
          suite_code=$?
          {
            echo "## Backend full suite (advisory, non-blocking)"
            echo ""
            echo "Known-red on current dev; see .github/workflows/known-red-backend-baseline.md."
            echo "The full suite is retained here for trend tracking. Cleanup is a separate item."
            echo ""
            echo "| check | exit |"
            echo "|---|---|"
            echo "| pytest tests | $suite_code |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  frontend:
    name: Frontend · test / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Node tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  lint-baseline:
    name: Lint baseline · advisory (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install ruff
        run: python -m pip install -r server/requirements-dev.txt
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Advisory lint baseline
        run: |
          set +e
          {
            echo "## Advisory lint baseline (non-blocking)"
            echo ""
            echo "Known-red on current dev. Reported for trend tracking; cleanup is a separate item."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          (cd server && ruff check . --statistics)
          ruff_code=$?
          (cd web && npm run lint)
          eslint_code=$?
          (cd web && npm run knip)
          knip_code=$?

          {
            echo "| check | exit |"
            echo "|---|---|"
            echo "| ruff | $ruff_code |"
            echo "| eslint | $eslint_code |"
            echo "| knip | $knip_code |"
            echo ""
            echo "Full output is in this job's log. Do not bulk-autofix or reformat here."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  gate-contract:
    name: CI gate contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert graded gate contract
        run: python .github/workflows/tests/test_ci_gate.py
