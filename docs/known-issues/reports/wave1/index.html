</style><main><nav><a href="../../timeline.html">施工时间线</a></nav><header><h1>第 1 波 · 止血</h1><p>逐项理解并发、预算、认证、输入安全与运维保障。每篇从事故场景讲到原理、修改、验证和边界。</p></header><div class="grid"><article class="card"><span class="tag">E1 · 验证通过，独立审核 PASS+NOTES</span><h2><a href="E1.html">聊天生成增加工作区准入和进程内执行上限</a></h2><p>让跨会话聊天需求先经过有上限的准入判断，避免一个工作区通过大量会话同时启动模型。容量已满时及时返回可重试的拒绝，不留下未被接受的消息，也不破坏原来的流式回复、幂等提交、中断、重试和恢复行为。</p></article></div></main></html>
