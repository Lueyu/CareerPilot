<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerPilot 施工时间线 · AI Agent 短板补全排程</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--panel2:#1d2639;--line:#2a3550;--text:#dbe4f5;--dim:#8b98b8;
--p0:#ff5d5d;--p1:#ffb020;--p2:#4da3ff;--ok:#3ecf8e;--acc:#7c6cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,20,32,.95);backdrop-filter:blur(6px);
border-bottom:1px solid var(--line);padding:14px 22px}
h1{margin:0 0 4px;font-size:18px}
.sub{color:var(--dim);font-size:12px}
a{color:var(--p2)}
.chip{display:inline-block;border:1px solid var(--line);background:var(--panel);color:var(--text);
border-radius:999px;padding:4px 12px;font-size:12px;text-decoration:none;margin-top:8px}
.chip:hover{border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:24px 22px 80px}
/* 甘特总览 */
.gantt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:28px}
.gantt h2{margin:0 0 10px;font-size:15px}
.grow{display:flex;align-items:center;gap:10px;margin:6px 0}
.glabel{min-width:150px;font-size:12px;color:var(--dim);text-align:right}
.gtrack{flex:1;position:relative;height:22px;background:var(--panel2);border-radius:6px}
.gbar{position:absolute;top:2px;bottom:2px;border-radius:5px;background:linear-gradient(90deg,#3b3f66,#5a4fa8);
display:flex;align-items:center;padding:0 8px;font-size:11px;color:#cfd6ff;white-space:nowrap;overflow:hidden}
.gbar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(62,207,142,.35);border-radius:5px}
.gbar span{position:relative}
.gaxis{display:flex;margin:4px 0 0 160px;font-size:11px;color:var(--dim)}
.gaxis div{flex:1}
/* 垂直时间线 */
.timeline{position:relative;margin-left:14px;padding-left:34px;border-left:2px solid var(--line)}
.wave{position:relative;margin-bottom:34px}
.wave::before{content:"";position:absolute;left:-43px;top:4px;width:16px;height:16px;border-radius:50%;
background:var(--panel);border:3px solid var(--acc)}
.wave.complete::before{border-color:var(--ok);background:var(--ok)}
.wave.active::before{border-color:var(--p1)}
.wtitle{font-size:16px;font-weight:700;margin-bottom:2px}
.wmeta{font-size:12px;color:var(--dim);margin-bottom:10px}
.wprog{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;max-width:320px;margin:6px 0 12px}
.wprog>div{height:100%;background:var(--ok)}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.track{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.track.serial{border-left:3px solid var(--p1)}
.thead{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.tname{font-family:Consolas,monospace;color:var(--acc);font-weight:700}
.serial-tag{font-size:10px;color:var(--p1);border:1px solid var(--p1);border-radius:4px;padding:0 5px}
.parallel-tag{font-size:10px;color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 5px}
.tids{margin:4px 0}
.item-link{display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0;text-decoration:none}
.item-link .badge{font-size:11px;border-radius:6px;padding:1px 7px;font-family:Consolas,monospace}
.P0{background:#3a1520;color:var(--p0);border:1px solid var(--p0)}
.P1{background:#3a2c10;color:var(--p1);border:1px solid var(--p1)}
.P2{background:#12253a;color:var(--p2);border:1px solid var(--p2)}
.item-link.done .badge{opacity:.5;text-decoration:line-through}
.item-link .st{font-size:10px;color:var(--dim)}
.item-link .st.DONE,.item-link .st.ACCEPTED{color:var(--ok)}
.item-link .st.IN_PROGRESS{color:var(--p1)}
.arrow{color:var(--dim);font-size:12px;margin:0 2px}
.twork{font-size:12.5px;color:var(--text);margin:4px 0}
.tdep{font-size:11.5px;color:var(--dim)}
.tdep b{color:var(--p1);font-weight:600}
.wnotes{margin-top:10px;font-size:12.5px;color:var(--dim)}
.wnotes p{margin:3px 0}
code{background:#0c1120;border:1px solid var(--line);border-radius:4px;padding:0 5px;
font-family:Consolas,monospace;font-size:12px;color:#9fd0ff;word-break:break-all}
/* 依赖与里程碑 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:26px}
.panel h2{margin:0 0 8px;font-size:15px}
.dep-line{font-family:Consolas,monospace;font-size:12.5px;margin:5px 0;color:var(--text)}
.mile{margin:6px 0;font-size:13px}
.mile b{color:var(--ok)}
footer{color:var(--dim);font-size:12px;text-align:center;padding:20px}
.legend{font-size:11.5px;color:var(--dim);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>CareerPilot 施工时间线 <span class="sub">60 项短板 · 7 波排程 · 同波可并行 / 跨波硬依赖 · 事实源 KNOWN_ISSUES.md</span></h1>
  <a class="chip" href="index.html">← 返回短板看板</a>
  <span class="sub" id="stats" style="margin-left:12px"></span>
</header>
<main>
  <div class="gantt">
    <h2>总览（按单人专注工时估算，波内并行可压缩实际历时）</h2>
    <div id="gantt"></div>
    <div class="gaxis" id="gaxis"></div>
    <div class="legend">条形位置=累计工时窗口；绿色填充=该波已完成比例。估算仅供排期参考，非承诺工期。</div>
  </div>
  <div class="timeline" id="timeline"></div>
  <div class="panel"><h2>关键依赖链（防走弯路）</h2><div id="deps"></div></div>
  <div class="panel"><h2>里程碑（面试叙事 checkpoints）</h2><div id="miles"></div></div>
</main>

类请求走确定性直出（PR #37 已含）；分页检索工具化（配合 B1）。"}, {"id": "A4", "cat": "A", "catName": "检索与知识管理", "title": "检索无评测集、无召回基线", "priority": "P0", "status": "OPEN", "state": "路由有冻结评测集（`server/acceptance/auto_quality_v1.json`，44+24 题，SHA-256 固定），但**资料库检索没有任何 query→相关文档标注集**，recall/MRR 无从谈起。", "code": "`server/acceptance/auto_quality.py:28-36`（只有路由评测）；全仓无检索评测。", "why": "没有基线就无法证明任何检索升级有效，也无法防回归。这是\"做过实验\"与\"堆技术名词\"的分水岭，面试必问。", "fix": "从真实查询日志 + 人工构造 50–100 条 query→相关题/笔记标注；写离线评测脚本输出 recall@12 / MRR / 零命中率；每次检索改动跑基线对比，结果落 `docs/benchmarks/`。"}, {"id": "A5", "cat": "A", "catName": "检索与知识管理", "title": "项目代码证据检索是手写字面打分器，无符号级理解", "priority": "P2", "status": "OPEN", "state": "CamelCase/snake_case 拆词 + 汉字 trigram + 中英别名词典 + 手工线性加权（20×exact + 7×direct + …）；无 AST/符号索引，找不到\"定义在哪、被谁调用\"。", "code": "`server/app/services/study_evidence_search.py:28-65,94-157`；`study_project_evidence.py:253-340`（定义/调用者/测试角色加分是启发式）。", "why": "代码问答的证据质量决定讲解质量；字面匹配对重构/别名/跨文件调用无能为力。工业级代码 agent 用 LSP/tree-sitter 符号索引。", "fix": "tree-sitter 建符号表（定义/引用/调用边），检索按符号图扩展一跳；保留字面分作为 fallback；用\"证据命中率\"评测。"}, {"id": "A6", "cat": "A", "catName": "检索与知识管理", "title": "记忆召回无相关性排序", "priority": "P1", "status": "OPEN", "state": "记忆召回全是 SQL 条件过滤 + 时间排序取前 N（学习记忆前 5、审核反馈前 8、项目记忆前 2）；记忆条数增长后“最近≠最相关”（注：聊天主链路彻底不接记忆的断链漏洞单列在 C5）。", "code": "`server/app/services/learning_memory.py:29-40`、`bank_review_memory.py:80-110`、`project_memory.py:17-22`。", "why": "记忆量级增长后按时间截断会把核心长期偏好/薄弱点挤出窗口，工业级 Memory 召回需要相关性 + 时效/重要度联合打分。", "fix": "先修 C5 打通闭环，再按 skill/主题标签 + A1 混合检索做相关性召回，叠加时间衰减权重。"}, {"id": "A7", "cat": "A", "catName": "检索与知识管理", "title": "代码证据检索标识符硬剪枝 + 文件名 Top-100 截断 + 面经/笔记全量进内存扫描", "priority": "P1", "status": "OPEN", "state": "① `study_evidence_search.py:149-150` 写死 `if self.identifiers and not exact: return 0`，提问带任何大小写稍异或误判标识符直接整文件归零；② `study_project_evidence.py:217-221` 仅按文件名打分取前 100 才打开读内容，按业务语义提问时文件名未命中则直接漏召回；③ `study_chat_context.py:115-143` 把整个 workspace 的 `ImportSession` 和 `StudyNote` 全量拉回 Python 内存做 `casefold()` 子串遍历。", "code": "`server/app/services/study_evidence_search.py:146-157`；`server/app/services/study_project_evidence.py:217-221`；`server/app/services/study_chat_context.py:115-143`。", "why": "代码问答漏召回与性能退化的直接元凶，面试官看检索代码一眼就能挑出的明显硬伤。", "fix": "标识符精确命中改为高权重加分而非零容忍剪枝；代码内容召回改为倒排/ripgrep/语义索引替代“仅文件名 Top-100”；面经与笔记检索下推数据库 FTS/pgvector（与 A1 统一）。"}, {"id": "B1", "cat": "B", "catName": "Agent 编排与自主性", "title": "无 tool-calling 循环，模型无法主动获取信息", "priority": "P0", "status": "OPEN", "state": "LLM 出口从不传 `tools`/`tool_choice`（甚至 `llm_stream.py:124-125` 遇到 `tool_calls` 直接报错拒绝）；每轮最多 2 次固定用途调用（产物修复/档位 failover）；检索由代码预先执行，模型不能按推理结果动态调用工具再查/再读；`interview_workflow` 只是用户手工按钮驱动的字符串步骤表。", "code": "`server/app/services/llm.py:106-118`（payload 无 tools）；`server/app/services/llm_stream.py:124-125`（拒绝 `tool_calls`）；`study_chat.py:467`（max_calls=2）；`study_chat.py:229-264`（`_gather_sources` 预检索）。", "why": "**这是上海 AI Agent 社招最致命的短板。** 面试官必然深挖 ReAct/Function Calling Loop、工具 Schema 设计、工具调用失败重试/降级、循环终止与防死循环、权限与预算护栏。纯确定性 Workflow 可以做主干，但完全没有自主 Tool-Calling Loop 会让你在 Agent 岗竞争力直接掉一档。", "fix": "依赖 B7 开放流式工具协议后，在资料库深度问答与项目代码问答中构建**受限 ReAct 工具环**：白名单只读工具（`search_bank` / `read_note` / `search_code` / `read_file_lines` / `get_user_memory`），最多 5 轮、token+时间+调用数三重预算封顶、工具参数 Pydantic 校验、异常转为可观察 error observation 让模型自愈、每步落结构化 Trace。同时保留确定性 Workflow 用于强审计评分链路，形成“Workflow vs Bounded Agent”完整架构叙事。"}, {"id": "B2", "cat": "B", "catName": "Agent 编排与自主性", "title": "意图路由纯正则枚举，长尾说法漏路由", "priority": "P1", "status": "OPEN", "state": "前端 intentMatchers/roleMatchers 硬编码正则，后端 teaching_action 再细分；无 LLM 分类、无 embedding 相似度路由。", "code": "`web/src/interview/chat/model.ts:130-189`；`server/app/services/study_chat.py:142-158`；`study_routing.py:88-155`。", "why": "正则覆盖不了自然语言长尾（\"帮我看看这题我答得咋样\"可能漏判）；路由错误静默降级到 coach，用户无感知。规则路由的可复现性是优点，但需要兜底层。", "fix": "三级路由：正则（快、确定）→ 轻量分类器/小模型（长尾）→ 置信度低时显式问用户；路由决策与置信度落 trace；用现有 auto_quality 评测集扩长尾样本回归。"}, {"id": "B3", "cat": "B", "catName": "Agent 编排与自主性", "title": "工作流状态机只支持线性步骤，无分支/回退/动态插入", "priority": "P2", "status": "OPEN", "state": "6 技能固定步骤元组，支持 start/pause/resume/skip/advance/change，乐观锁防并发；不能回退到已完成步骤、不能按表现动态分支（如答得差插入补强步）。", "code": "`server/app/services/interview_workflow.py:9-68`；状态存 `study_sessions.context` JSONB（`api/v1/study_chat.py:189-201`）。", "why": "真实模拟面试需要根据回答质量动态追问/降难度；固定脚本的\"面试官\"体验机械。工业级对话 agent 的状态机应支持条件转移。", "fix": "步骤图加条件边（由确定性评分信号驱动，不让 LLM 直接改状态）；支持回退与插入步骤；保持 revision 乐观锁与\"LLM 只读状态\"边界。"}, {"id": "B4", "cat": "B", "catName": "Agent 编排与自主性", "title": "模拟面试多轮靠\"对话粘性\"正则维持，无显式会话模式", "priority": "P2", "status": "OPEN", "state": "上一条 assistant 是 interview 且本轮无\"结束/暂停/解释\"等词则继续 interview——模式维持靠词面判断。", "code": "`server/app/services/study_chat.py:216-222`。", "why": "用户说\"这题为什么\"想听解释，可能被粘性规则困在面试模式；模式切换意图与 B2 同源但更隐蔽。", "fix": "会话显式 `mode` 字段 + 切换意图识别；与 B3 的条件状态机合并设计。"}, {"id": "B5", "cat": "B", "catName": "Agent 编排与自主性", "title": "evolution 策略闭环被硬编码熔断，无在线实验能力", "priority": "P2", "status": "ACCEPTED", "state": "候选生成（确定性规则）+ 离线投影评估已实现；激活被硬编码关闭（approve 403、get_active_candidate 恒 None），无 A/B、无 canary、无自动停损。", "code": "`server/app/services/evolution.py:337-363`；`server/app/config.py:98-100`（`evolution_activation_enabled` 恒 False）；`api/v1/evolution.py:138-144`。", "why": "作为\"自进化学习系统\"叙事，生效环节缺失使闭环断在最后一步。但熔断本身是正确的 fail-closed 设计（评估是投影不是实验，样本不足）。", "fix": "保持默认关闭；补\"小流量 workspace 灰度 + 指标守护（得分率/复测率不降）+ 自动回滚\"后才允许激活；或明确 ACCEPTED 并准备好\"为什么不敢开\"的话术（评估证据不足）。"}, {"id": "B6", "cat": "B", "catName": "Agent 编排与自主性", "title": "追问建议/学习计划纯规则，无个性化排序", "priority": "P2", "status": "ACCEPTED", "state": "followup 是 7 类 Gap 规则表（文件头明确\"LLM 不参与——必须稳定可复现\"）；planner 从 rubric 缺失项确定性生成任务。", "code": "`server/app/services/followup.py:1-55`；`planner.py:17-113`。", "why": "个性化是学习产品的核心卖点，当前\"千人一面\"。规则可复现是优点，但难度无校准（D3）使\"按失分学习\"的精度受限。", "fix": "难度标定（D3）先行；规则产出候选 + 模型排序的混合个性化；保留确定性兜底。"}, {"id": "B7", "cat": "B", "catName": "Agent 编排与自主性", "title": "LLM 网关“伪多厂商 + 拒绝流式 tool_calls + 无连接池 + 流式回调同步阻塞 DB”", "priority": "P0", "status": "OPEN", "state": "① `llm_stream.py:124-125` 遇到 `tool_calls` 直接 `fail('unsupported_delta')`，阻塞任何流式 Agent 工具调用；② `llm.py:113-114` 把智谱/DeepSeek 专属 `thinking` 字段硬塞进通用 OpenAI payload，`llm_stream.py:147` 只认 `reasoning_content` 且 `80-82, 112-120` 对 finish 后 usage 帧极挑剔，遇其他网关易误杀；③ `llm.py:195,206` 每次请求新建 `httpx.AsyncClient` 无连接池复用，`llm.py:126` 残留死变量 `retries = 0`，`llm.py:352` 全局单例 `adapter` 的 `last_error/last_usage` 实例属性存在并发覆盖隐患；④ `study_chat.py:433` 在 SSE `on_content` 回调内直接 `await save(\"generating\", ...)` 同步写 PG，无背压解耦，DB 抖动会直接卡死上游流读取；`llm.py:294-308` 在 `finally` 中 `await _record_metric` 遇 `CancelledError` 有取消态写库风险。", "code": "`server/app/services/llm.py:69-71,106-126,195-208,294-308,352`；`server/app/services/llm_stream.py:80-82,112-125,147,209-212`；`server/app/services/study_chat.py:432-435`。", "why": "LLM 网关是 Agent 系统的基础设施底座。不解开 `tool_calls` 流式组装，B1 做不成流式体验；不解耦流式回调与 DB 写、不复用连接池，并发和高负载下 TTFT 与稳定性立刻崩；厂商私有字段直塞会导致“多模型路由/降级”一换模型就 400。", "fix": "① 扩展 `llm_stream.py` 支持增量 `tool_calls` 分片组装（保持字节上限防打爆）+ 兼容 `reasoning`/`reasoning_content` 及尾帧 usage；② 抽 Provider Dialect 适配层（OpenAI/DeepSeek/Anthropic/Gemini），厂商扩展字段按 dialect 注入；③ 进程级复用 `httpx.AsyncClient` 连接池，消除全局可变诊断状态改为返回结构化 `CallResult`；④ `study_chat` 流式落库改异步缓冲/队列解耦（不阻塞上游 SSE 读取），`finally` 指标写入用 `asyncio.shield` 或独立后台落盘。"}, {"id": "C1", "cat": "C", "catName": "上下文工程与记忆", "title": "token 计数用 UTF-8 字节估算，\"保守上界\"对英文不成立", "priority": "P1", "status": "OPEN", "state": "无 tiktoken/任何 tokenizer；上下文预算按 UTF-8 字节算。中文高估（3 字节≈1–2 token）浪费窗口，英文/符号串可能低估（BPE 对罕见符号串可膨胀），`conservative upper bound` 注释不严格成立。", "code": "`server/app/services/study_chat.py:359-361`；`project_autopilot_engine.py:511-513`（自报 `conservative_utf8_bytes_not_actual_tokens`）；`public_model.py:151-160`。", "why": "低估→provider 400 context_length_exceeded；高估→白白丢弃可用上下文。工业级必须按目标模型 tokenizer 精确计数（至少对主流模型）。", "fix": "tiktoken（OpenAI 系）+ 各 provider tokenizer 适配表；未知模型保留字节估算但加安全系数并标注估算口径；对 400 溢出加\"自动重拟合降级\"路径与测试（D6）。"}, {"id": "C2", "cat": "C", "catName": "上下文工程与记忆", "title": "长对话机械截断，关键约束静默丢失，无 LLM 摘要", "priority": "P1", "status": "OPEN", "state": "最近 12 轮全文，更早轮次 `text[:180]` 硬截断成摘录；再超限每轮截 1400 字。无滚动摘要。产品自己的题库里就写着这种反模式（\"预算 5 万\"被压成\"有预算\"）。", "code": "`server/app/services/study_chat.py:119-139,285-292`；反面案例 `answer_gen.py:96`。", "why": "长会话中用户给过的约束（目标岗位、预算、已排除方案）被截掉后模型会重复犯错，直接损害教学可信度。", "fix": "LLM 滚动摘要（保数字/边界条件/决策的 schema 化摘要）+ 关键事实钉住（pinned facts 不截断）；摘要质量用\"约束保留率\"评测；摘要调用计入预算与 trace。"}, {"id": "C3", "cat": "C", "catName": "上下文工程与记忆", "title": "无 prompt caching，稳定前缀每轮重复计费", "priority": "P1", "status": "OPEN", "state": "system 人设/合同指令每轮全量发送；无 provider prompt cache 利用，也无本地语义缓存。评分侧 outbox 是防崩溃重复，不是成本缓存。", "code": "`server/app/services/llm.py:106-118`（payload 无 cache 控制）；`assessment_worker.py:79-98`（outbox 仅崩溃恢复）。", "why": "prefill 是 TTFT 与成本大头；稳定前缀不缓存等于每轮白付。工业级 LLM 网关标配 prompt cache + 结果缓存。", "fix": "prompt 排布缓存友好（稳定内容前置）；接 provider cache 参数；评分按 `(input_hash, rubric_version, model_fingerprint)` 做结果缓存；上报缓存命中率与节省金额。"}, {"id": "C4", "cat": "C", "catName": "上下文工程与记忆", "title": "记忆无遗忘/衰减/容量治理", "priority": "P2", "status": "OPEN", "state": "MemoryItem 有 SUPERSEDED/DISMISSED 状态与级联失效（亮点），但无时间衰减、无容量上限、无定期整理；freshness 只有 CURRENT/NEEDS_REVIEW 两态。", "code": "`server/app/models/memory.py:16-37`；`learning_memory.py:43-88`（级联失效）。", "why": "长期使用后记忆膨胀，召回前 N 条被陈旧记忆占据；工业级记忆系统需要 consolidation（合并/提炼）与遗忘策略。", "fix": "定期离线整理任务（同主题记忆合并、过期降级）；召回加时间衰减权重；与 C2 的摘要机制共用基建。"}, {"id": "C5", "cat": "C", "catName": "上下文工程与记忆", "title": "记忆治理与聊天主链路彻底割裂（且练习题干裸拼 `str(notes)`）", "priority": "P0", "status": "OPEN", "state": "① 写了一整套 `learning_memory`（学习观察/偏好）和 `project_memory`（项目确认记忆）的审核状态机与级联失效，但高频交互入口 `study_chat.py` **完全不读 `learning_memory`**，也绕过了 `project_sources()` 不读 `project_memory`；② 唯一消费 `learning_memory` 的 `learning_feedback.py:228` 竟然直接用 `str(notes)` 把 Python 列表字面量 `['已确认的...']` 拼进给用户和模型看的练习题干。", "code": "`server/app/services/study_chat.py`（零引用 `learning_memory`/`project_memory`）；`server/app/api/v1/study_chat.py:29`（注释证实 `project_sources` 为死导入）；`server/app/services/study_project_evidence.py:527-573`；`server/app/services/learning_feedback.py:227-228`（`str(notes)` 裸拼）。", "why": "面试讲“我做了带审核状态机和级联失效的 Memory 系统”，面试官追问“用户确认后的记忆怎么影响下一轮对话教学？”，一翻代码发现主聊天根本没接、练习还拼成 `['...']`，瞬间露馅。", "fix": "① 立刻修复 `learning_feedback.py:228` 改为结构化格式化拼接；② 把已确认的 `learning_memory` / `project_memory` / `bank_review_memory` 统一经独立 `memory_context`（带来源标注与 token 预算）接入 `study_chat`；③ 配合 B1 提供 `get_user_memory` 按需检索工具；补“确认记忆→聊天生效→撤回记忆→聊天不再引用”端到端回归测试。"}, {"id": "D1", "cat": "D", "catName": "LLM 输出质量与评估体系", "title": "评分 judge 无 meta-evaluation：从未与人工标注对齐", "priority": "P0", "status": "OPEN", "state": "judge 测试全是结构校验（拒伪引用/坏 JSON/越界分），没有任何\"人工分 vs LLM 分\"一致率测试；rubric 候选自认 `human_reviewed:false, is_gold_standard:false`；judge-prompt v3→v4 升级无分数回归证据。", "code": "`server/tests/test_core_scoring.py:311`、`test_assessment_rubric.py:137`（只测结构）；`docs/assessment/rubric-candidates.json:3-5`；`server/tests/fixtures/build_assessment_candidates.py:186`（coverage_gaps 自认未校准）；`llm_judge.py:145-146`（版本常量切换）。", "why": "产品核心主张是\"用真实作答找出差距\"，结构护栏只保证\"格式对\"不保证\"分数对\"。这是全项目最大的正确性洞，也是面试最锋利的追问点。", "fix": "建 golden set（30–50 题 × 人工逐项判档），算逐 criterion 一致率 + Cohen's kappa + 总分 MAE；每次 judge prompt/模型变更跑回归；把 `UNCALIBRATED` 升级为\"校准过、一致率 X%\"并写进产品文案。"}, {"id": "D2", "cat": "D", "catName": "LLM 输出质量与评估体系", "title": "聊天讲解正文无事实性校验", "priority": "P1", "status": "OPEN", "state": "结构化产物有强校验（图表数值必须与来源 JSON 逐值相等、project 图必须引真实代码证据），但自由文本讲解直接落库，只有事前 prompt 约束。", "code": "`server/app/services/study_blocks.py:74-95`（产物校验）；`study_chat.py:507-543`（正文无校验）。", "why": "教学场景里一句错误的技术断言比没有答案更糟；\"引用分级\"合同是软约束，模型可违反。", "fix": "关键技术断言抽样二次 judge（cheap model 核查与来源一致性）；或 citation-grounding 轻量校验（断言→来源句蕴含）；先对 project 类回答启用（有代码证据可核对），统计违规率再决定覆盖面。"}, {"id": "D3", "cat": "D", "catName": "LLM 输出质量与评估体系", "title": "生成题目难度写死、无区分度标定", "priority": "P1", "status": "OPEN", "state": "AI 生成题审核通过后 `difficulty=3` 硬编码；无试答标定、无区分度统计；rubric 多为 AI_DRAFT/LEGACY_UNCALIBRATED。", "code": "`server/app/services/question_review.py:92`；`assessment_rubric.py:75`（校准三档）。", "why": "难度失真的题池使\"按失分学习/组卷\"的梯度失效；工业级题库需要 item calibration。", "fix": "用真实作答数据反推难度（得分率分桶）与区分度（高低分组差）；新题先入\"试答池\"积累 N 次独立作答再定级；与 D1 的 golden set 共用标注流程。"}, {"id": "D4", "cat": "D", "catName": "LLM 输出质量与评估体系", "title": "prompt 版本管理分裂：聊天/出题/播客硬编码，无变更回归", "priority": "P1", "status": "OPEN", "state": "judge 与项目管线有 prompt_version + sha256 落库（好）；但聊天教学 prompt 在 `locales/*.generation.json` 无版本字段，出题/播客 prompt 硬编码 Python；任何 prompt 改动没有\"同批输入新旧对比\"的回归机制。", "code": "`server/app/generation_i18n.py:10-13`（lru_cache 读文件无版本）；`llm_judge.py:20`、`api/v1/question_generation.py:35-87`、`podcast_content.py:47`（硬编码）；对比 `project_prompts/__init__.py:5`（有 bundle 版本）。", "why": "prompt 是 LLM 应用的\"代码\"，无版本无回归等于裸奔上线；面试讲\"prompt 工程化\"时这是明显断点。", "fix": "所有 prompt 统一 bundle 化 + 内容 hash 版本落库（复用 judge 的模式）；建 prompt 回归夹具（固定输入→输出质量断言/人工抽检清单）；变更走与代码相同的 PR 审核。"}, {"id": "D5", "cat": "D", "catName": "LLM 输出质量与评估体系", "title": "换模型只有\"拒绝\"没有\"验证\"：影子复核文案承诺了不存在的功能", "priority": "P1", "status": "OPEN", "state": "model_fingerprint/judge_version 变化→CONFIG_CHANGED 拒绝混跑，错误文案让用户\"创建影子复核\"，但产品内无此功能；唯一影子实现是一次性验收脚本。无 A/B/canary。", "code": "`server/app/services/assessment_jobs.py:272-273`、`assessment_worker.py:134-136`；`locales/zh-CN.json:272`；`server/acceptance/coach_shadow_judge.py:1,18`（READ_ONLY_SHADOW 仅验收）。", "why": "模型升级决策无质量证据支撑；文案与能力不符本身就是产品缺陷。工业级模型管理=指纹一致性+影子流量+质量门禁。", "fix": "把验收脚本产品化为\"影子复核任务\"（新模型对历史 N 题只读复评，产出与 D1 golden set 的对齐报告）；通过门禁才允许切换默认模型；修正文案。"}, {"id": "D6", "cat": "D", "catName": "LLM 输出质量与评估体系", "title": "无 provider 语义错误演练：上下文溢出 400 直接终态", "priority": "P2", "status": "OPEN", "state": "聊天路径 4xx（非 408/429）直接失败不重试；无 context_length_exceeded 自动降级重拟合；畸形流测试很全（16 种）但 provider 语义错误覆盖少。", "code": "`server/app/services/study_chat.py:548-551`；`tests/test_llm_stream_transport.py`。", "why": "C1 的估算偏差最终会在这里变成用户可见失败；工业级网关对可恢复的 400（溢出/参数）应有自动修复路径。", "fix": "识别溢出错误码→按 C1 精确计数重拟合→降档重试一次；加 MockTransport 演练用例。"}, {"id": "D7", "cat": "D", "catName": "LLM 输出质量与评估体系", "title": "代码题无沙箱执行，纯静态评审", "priority": "P2", "status": "ACCEPTED", "state": "coding_debugging 题只接收文本/diff 做静态评审 + 行号引用校验，limits 明确\"无自动执行/CI 验证\"，并正则拦截\"测试已通过\"类虚假声明。", "code": "`server/app/services/project_practice.py:77,89,236,256-259`。", "why": "代码能力的最终证据是\"能跑对\"，静态评审无法验证正确性；但本地跑不可信代码的安全成本高，当前诚实标注是正确取舍。", "fix": "若要补：Docker 一次性容器 + 网络禁用 + CPU/内存/时限 + 只读挂载 + 输出限额；执行结果作为评分证据进入同一 rubric 链路。或保持 ACCEPTED 并讲清安全边界。"}, {"id": "D8", "cat": "D", "catName": "LLM 输出质量与评估体系", "title": "无多模态输入：图片仅 OCR、语音输入未接入", "priority": "P2", "status": "OPEN", "state": "图片走 RapidOCR 提文字，LLM payload 恒纯文本（无 image_url/vision 块）；exam 预留 transcript 字段但无 ASR 链路；TTS 播客有文本侧规则校验但无听感质量评估。", "code": "`server/app/services/text_extract.py:22,142-157`；`llm.py:108`；`models/exam.py:94`；`podcast_content.py:213-252`。", "why": "面试白板题/架构图截图是高频场景，OCR 丢结构信息；语音模拟面试是差异化体验。工业级 agent 平台通常至少支持 vision 输入。", "fix": "vision 模型接入（messages 支持 image_url 块 + 图片大小/类型闸）；ASR 用本地 whisper 系；TTS 加抽听评审清单与术语发音回归。"}, {"id": "D9", "cat": "D", "catName": "LLM 输出质量与评估体系", "title": "评分引用校验过于脆弱且存在单字绕过漏洞", "priority": "P0", "status": "OPEN", "state": "`assessment_rubric.py:203-207` 的 `_quotes()` 直接做 `quote not in text` 严格精确子串匹配——连空白折叠/全半角标点归一化都没有（对比 `study_notes.py:158-160` 至少做了空白折叠），多一个换行或标点差异即整题报 `INVALID_QUOTE`；同时**无最小长度校验**，模型只要引用单个字（如 `\"的\"`/`\"是\"`）即可通过校验，反幻觉护栏被单字架空。", "code": "`server/app/services/assessment_rubric.py:203-207`；对比 `server/app/services/study_notes.py:158-160`。", "why": "评分引用校验是你全项目最核心的面试卖点之一。面试官只要追问“LLM 引用漏了个标点怎么办？模型引用一个‘的’字会不会绕过？”，当前代码立刻穿帮。", "fix": "① 引入规范化匹配层（空白折叠 + 全半角/常见标点归一 + 轻度编辑距离/span 对齐回溯原文坐标）；② 增加最小有效字符长度与停用词拦截（防单字/纯标点绕过）；③ 把真实多模型 `INVALID_QUOTE` 失败率与绕过对抗样本纳入 D1 评估集回归。"}, {"id": "E1", "cat": "E", "catName": "成本与性能治理", "title": "聊天生成走 BackgroundTasks 绕过队列：跨会话无并发上限", "priority": "P0", "status": "DONE", "state": "\"全局单并发\"只覆盖后台评分/项目 worker；study_chat 用 FastAPI BackgroundTasks 直接生成，单会话单生成有 409 保护，但一个用户开 100 个会话可并发 100 个生成，每个最长 30 分钟。", "code": "`server/app/api/v1/study_chat.py:342`（tasks.add_task）；对比 `project_jobs.py:158-173`（advisory lock 单并发）；`config.py:14`（30 分钟超时）。", "why": "失控客户端/误操作可产生无上限并发账单与 provider 限流雪崩；\"我做了单并发成本控制\"的面试叙事在这里被戳穿。BackgroundTasks 还意味着 API 进程重启即丢在飞生成（靠租约恢复兜底，钱白花）。", "fix": "聊天生成并入持久队列（复用租约/fencing/outbox 基建），或至少加 per-workspace 并发闸 + 全局 Semaphore；把\"为什么聊天没走队列\"的历史原因写进 ADR 并给出迁移路径。"}, {"id": "E2", "cat": "E", "catName": "成本与性能治理", "title": "私有路径成本只有 ¥2/M 估算，无货币预算与告警", "priority": "P0", "status": "DONE", "state": "输入/输出不分价、不分模型，固定 `total_tokens × 2e-6`；无每日/每会话货币上限；项目自动分析默认预算为空（不限调用次数/读取字节）。真预算账本只在公开 seed 网关有。", "code": "`server/app/services/llm.py:271,326`；`project_autopilot_config.py:10-11`（DEFAULT_BUDGET={}）；对比 `public_model.py:119-124,172-188`（月/日预算 + advisory lock 账本，全仓唯一真计价）。", "why": "按 token 花钱的系统没有成本闸=生产事故预备役；估算价使成本报表不可信。", "fix": "把 public_model 的预留-结算账本模式推广到私有路径；按模型配置输入/输出单价；日预算超限 429+提示；项目分析默认预算给非空值；成本异常（环比翻倍）进告警（G3）。"}, {"id": "E3", "cat": "E", "catName": "成本与性能治理", "title": "无 API 层限流与配额", "priority": "P1", "status": "DONE", "state": "限流只存在于 telemetry/注册登录/公开 coach 等局部；主 API（聊天/出题/导入/分析触发）无每用户 RPS/并发/日配额。", "code": "`server/app/api/v1/telemetry.py:93-113`、`api/public_auth.py:205,239-240`（局部有）；`api/v1/study_chat.py`、`question_generation.py`（无）。", "why": "与 E1 叠加放大成本风险；注册版公网暴露时这是基本安全要求。", "fix": "中间件级令牌桶（按 workspace/token），区分读/写/LLM 触发三类配额；超限返回 429+Retry-After；配额配置进 settings。"}, {"id": "E4", "cat": "E", "catName": "成本与性能治理", "title": "TTFT 优化缺 prefill 侧手段：无缓存、检索串行、连接冷启动", "priority": "P1", "status": "OPEN", "state": "已有双档路由 + 字节预算裁剪（好）；但 sources 串行收集后才开始生成（项目证据独立预算 120s）、无 prompt cache（C3）、httpx 每调用新建 client 无共享连接池。", "code": "`server/app/services/study_chat.py:229-264`（_gather_sources 串行）；`llm.py:196`（AsyncClient 用法）；`llm_stream.py:144`（TTFT 埋点已有）。", "why": "TTFT 分解里\"检索+prefill\"两段都没优化；面试讲 TTFT 优化时只有路由一张牌。", "fix": "检索与首段生成并行/打字时预取；共享 httpx.AsyncClient 连接池；C3 的 prompt cache；artifact 校验不阻塞首字。用现有 bench_study_chat.py 配对 A/B 量化每项收益。"}, {"id": "E5", "cat": "E", "catName": "成本与性能治理", "title": "指标聚合取最近 5000 条内存算分位数，量大失真", "priority": "P2", "status": "OPEN", "state": "ops summary 拉最近 5000 条 AgentMetric 在 Python 里算 p50/p95/p99；无预聚合、无时间分桶。", "code": "`server/app/api/v1/ops.py:129-160`。", "why": "数据量增长后既慢又截断失真（只反映最近窗口）；工业级用时序预聚合或 PG 百分位聚合。", "fix": "按小时/天预聚合表（percentile_cont）；或接 Prometheus histogram（G2）。"}, {"id": "F1", "cat": "F", "catName": "可靠性与任务基建", "title": "outbox 是本地文件，多机/容器化即失效", "priority": "P1", "status": "OPEN", "state": "评分结果先 fsync+os.replace 落盘 `personal/assessment-outbox/<db-hash>/…json` 再提交 DB；崩溃接管靠同机文件重放。容器重建/多 worker 跨机时文件不可达，防重复付费语义丢失。", "code": "`server/app/services/assessment_worker.py:31-45,79-98,173-175`。", "why": "这是\"单机正确\"的设计，工业级要求存储与计算分离；docker-compose 部署时 outbox 目录若不挂卷，重建即丢。", "fix": "事务性 outbox 表（结果与状态同库同事务，接管者从 DB 重放）；保留文件版作单机加速层可选；补\"接管者跨进程重放\"测试。"}, {"id": "F2", "cat": "F", "catName": "可靠性与任务基建", "title": "单 worker 单并发无水平扩展实现，两套队列语义并存", "priority": "P2", "status": "OPEN", "state": "advisory lock 刻意全局单并发（成本可控，正确）；但无按 workspace 分片、无多 worker 竞争消费实测；播客队列是另一套独立租约实现。", "code": "`server/app/services/assessment_jobs.py:151-178`；`project_jobs.py:158-173`；`podcast_jobs.py:46-103`（第二套队列）。", "why": "面试必问\"怎么扩展\"，当前只能口头回答；两套队列实现增加维护面与语义漂移风险。", "fix": "统一队列抽象（认领/租约/fencing/outbox 一套代码）；隔离库 PoC：N worker 分片认领 + 竞争消费正确性测试（不重复、不丢、fencing 生效）；写扩展性 ADR。"}, {"id": "F3", "cat": "F", "catName": "可靠性与任务基建", "title": "无 CI 测试门禁，769 个测试全靠本地自觉", "priority": "P0", "status": "OPEN", "state": "`.github/workflows/` 只有 pr-content-review.yml（fork PR 内容安全审查）；后端 ~769 测试函数、前端 ~243 测试无 CI 执行；测试隔离纪律很好（_test 库+清凭据）但没有强制触发点。", "code": "`.github/workflows/pr-content-review.yml`；`server/tests/conftest.py:14-25`；`server/run_isolated_tests.py`。", "why": "\"测试怎么保证执行\"是工程面试必问题；无门禁意味着 dev 分支可能带着红测试合入。", "fix": "GitHub Actions：PG service container + run_isolated_tests.py + 前端 node --test + ruff/tsc/eslint/knip；PR 必须绿；nightly 跑 opt-in 崩溃探针。"}, {"id": "F4", "cat": "F", "catName": "可靠性与任务基建", "title": "优雅停机是硬杀：API 不等在飞生成，worker 无 SIGTERM 处理", "priority": "P1", "status": "OPEN", "state": "部署脚本直接 Process.Kill()；API lifespan 只处理播客 worker；study_chat 在飞生成靠租约到期收敛 interrupted（钱白花）；project_worker 无信号处理器；compose 无 stop_grace_period。", "code": "`deploy/personal-processes.ps1:63-72`；`server/app/main.py:53-68`；`project_worker.py:310-322`；`docker-compose.yml:62-70`。", "why": "每次部署/重启都制造\"中断+重复付费窗口\"；工业级要求 drain（停止接单→等在飞完成/主动释放租约→退出）。", "fix": "worker 捕获 SIGTERM/CancelledError 主动释放租约（播客已有范式 `podcast_jobs.py:263-271`，推广）；API 加 drain 期；uvicorn --timeout-graceful-shutdown；compose stop_grace_period；E1 并入队列后此问题大幅缓解。"}, {"id": "F5", "cat": "F", "catName": "可靠性与任务基建", "title": "迁移无版本记账、无 down 路径，create_all 与 SQL 迁移双轨", "priority": "P2", "status": "OPEN", "state": "自研幂等 SQL 执行器（IF NOT EXISTS 约定），无版本表；新表靠 lifespan create_all，新列靠 SQL——双轨制无单一事实源；rollback 目录存在但无自动验证。", "code": "`server/migrate.py:1-9`；`server/app/main.py:55-57`；`server/migrations/`（22 个 SQL）。", "why": "单机可接受，但 schema 漂移无法检测（create_all 不改已有列）；团队协作/多环境部署会乱。", "fix": "alembic（autogenerate + 版本表）或至少给自研执行器加版本记账与 schema diff 校验；CI 里跑\"空库全量迁移+幂等重放\"测试。"}, {"id": "F6", "cat": "F", "catName": "可靠性与任务基建", "title": "备份无加密/异地/保留策略，灾难恢复到生产从未演练", "priority": "P2", "status": "OPEN", "state": "backup.ps1 工程质量好（原子落盘+pg_restore 校验+SHA256），但 dump 含明文密钥（G5）、无加密、无异地、无旧备份清理；restore.ps1 只允许恢复到 *_test 库——**从未验证过真实灾难恢复**；runbook 与脚本行为矛盾（文档说可覆盖生产）。", "code": "`deploy/backup.ps1:13-36`；`deploy/restore.ps1:12-14,31`；`deploy/ECS_DEPLOY_RUNBOOK.md:513-517`。", "why": "\"有备份\"≠\"能恢复\"；RTO/RPO 未知；备份本身是密钥泄露面。但属通用 DBA/运维债，个人求职冲刺期勿抢占 Agent 核心工时。", "fix": "备份加密（age/GPG）+ 异地副本 + 保留策略（如 7 日/4 周/3 月）；写\"恢复到生产\"的受控流程（显式确认+先备份现库）；定期恢复演练并记录 RTO；修正 runbook 矛盾。"}, {"id": "F7", "cat": "F", "catName": "可靠性与任务基建", "title": "无全局异常处理器，未处理异常裸 500 且不可关联", "priority": "P1", "status": "OPEN", "state": "main/public_main 均无 exception_handler；未处理异常走 Starlette 默认裸 500，traceback 只进 stderr，无 request_id 可关联；422 存在两种形态（auth 路由组统一 detail 字符串，其余 FastAPI 默认数组）。", "code": "`server/app/main.py`、`public_main.py`（无 handler）；`api/public_auth.py:57-75`（仅 auth 组）。", "why": "用户报障时无法定位；错误契约不一致增加前端处理成本。工业级 API 统一错误信封（code/message/request_id）。", "fix": "全局 handler：未处理异常→统一 500 信封 + 结构化日志（带 request_id）+ 指标计数；422 统一形态；业务错误码表文档化。"}, {"id": "F8", "cat": "F", "catName": "可靠性与任务基建", "title": "观测/配置路径静默吞错 + Worker 心跳协程脆弱", "priority": "P1", "status": "OPEN", "state": "① ops 聚合、指标落库、配置读取等路径存在 `except Exception: pass` 静默吞错；② `project_worker.py:220-227` 的 `keep_alive()` 心跳协程完全没有 `try/except`，一次 DB 瞬断会让心跳协程静默崩溃，导致后续租约过期任务被误判 `WORKER_LOST`；③ `assessment_worker.py:166-169` 一旦心跳捕获任意 DB 瞬断直接 `task.cancel()` 杀掉正在跑的付费 LLM 调用，缺少瞬态重连宽限；④ `assessment_worker.py` 本地 outbox 文件没有任何清理机制，只增不减；⑤ `study_notes.py:220-225` 写死 120s 租约不续期、过期即 `FAILED` 不重试。", "code": "`server/app/api/v1/ops.py:109-110,134-135,226-227,249-250`；`services/llm.py:51-52,290-291,307-308`；`server/app/project_worker.py:220-227`；`server/app/services/assessment_worker.py:166-169`；`server/app/services/study_notes.py:220-225`。", "why": "分布式队列是你最硬的后台工程卖点，但心跳在 DB 瞬断下直接挂掉或错杀付费任务是真实线上炸弹；观测吞错使排障自盲。", "fix": "心跳协程加有限次瞬态 DB 异常退避重试（仅在确认失权或连续失败耗尽租约宽限时取消任务）+ 告警日志；`except Exception: pass` 全部改为 `logger.warning` + 失败计数器；outbox 补完成清理与 TTL 扫盘（F1 迁移 DB 后自然消除）。"}, {"id": "G1", "cat": "G", "catName": "可观测性与运维", "title": "无结构化日志、无 request_id 贯穿链路、无轮转", "priority": "P0", "status": "OPEN", "state": "API 进程完全没有日志配置（只有 uvicorn access log）；worker 仅 basicConfig 纯文本；无 JSON 日志、无服务端 request_id/correlation_id 贯穿 API→worker→LLM（代码里的 request_id 全是客户端幂等键）；AgentMetric 无 trace_id 列且 workspace_id 从不填；日志靠部署脚本重定向文件，无限增长。", "code": "`server/app/main.py:1-130`（无 logging 配置）；`project_worker.py:318`（唯一 basicConfig）；`models/metric.py:21-42`、`services/llm.py:317-331`（指标不填 workspace_id）；`deploy/start-personal.ps1:72`。", "why": "用户报\"生成失败\"时，没有任何手段把一次 API 请求关联到 worker 步骤和具体 LLM 调用——只能盲猜。这是工业级可观测性的第一块地基，缺失使其他一切观测投资贬值。", "fix": "structlog/JSON 日志 + 中间件生成 request_id 贯穿（响应头回传、落 AgentMetric/Trace、worker 任务携带）；日志轮转；级别可配。"}, {"id": "G2", "cat": "G", "catName": "可观测性与运维", "title": "无 Prometheus/OTel 导出，指标只存 PG 靠人看看板", "priority": "P1", "status": "OPEN", "state": "AgentMetric/Trace/ops summary 自建体系质量不错（LLM 延迟分位/TTFT/错误分类/token 成本），但无 /metrics 端点、无 OTel、无 API 层 HTTP 延迟/错误率、无队列深度/积压指标、无连接池饱和度。", "code": "`server/app/api/v1/ops.py:295-344 B", "ids": "**J1**", "work": "画像信度（间隔重测相关）+效度小样本（vs 真实面试自报）", "dep": "2-A、6-A"}, {"track": "6-C `[串行]`", "ids": "**J3 → J2**", "work": "LLM 映射候选+人工审核降 UNMAPPED 率；自适应复测间隔（简化 SM-2）", "dep": "J3 先（映射覆盖是复测运转前提）"}, {"track": "6-D", "ids": "**B5**", "work": "evolution 灰度激活：小流量+指标守护+自动回滚", "dep": "6-C（间隔策略作为首个灰度候选）、5-C（守护指标）"}, {"track": "6-E", "ids": "**B6**", "work": "规则候选+模型排序的个性化追问/计划", "dep": "6-A（难度信号）"}, {"track": "6-F", "ids": "**D7**", "work": "代码沙箱：一次性容器+网络禁用+资源限额，执行证据进 rubric 链", "dep": "5 波（可靠性基建）；或正式 ACCEPTED 写 ADR"}, {"track": "6-G", "ids": "**D8**", "work": "vision 输入（image_url 块+图片闸）；ASR 本地 whisper；TTS 抽听回归", "dep": "3-A（多模态 token 预算）"}, {"track": "6-H", "ids": "**J4**", "work": "播客听感评审清单+术语发音回归+离线缓存 hash 校验", "dep": "无硬依赖"}], "notes": ["**门禁**：每项产出\"数字或正式 ACCEPTED ADR\"二选一，不允许静默搁置。"]}], "deps": ["F3/G1 → 一切", "E1 闸 → E2 账本 → G3 成本告警；E1 队列化 ← F1 outbox ← F4 停机", "G5 加密 → F6 备份加密演练", "D1 golden set → D4 回归 / D5 影子 / D2 抽检 / D3 标定 / J1 效度", "A4 评测集 → A2 基线 → A1 混合检索 → B1 工具环", "C1 精确 token → D6 溢出恢复 / C2 摘要预算", "C3 缓存 → E4 TTFT 总收益", "5-C 指标 → G7 保留分层 / B5 灰度守护", "J3 映射 → J2 间隔 → B5 灰度"], "miles": ["**M1（第 1 波末）**：\"我发现并修复了自己系统的资金与安全洞\"——并发闸/成本账本/密钥加密/SSRF，事故驱动叙事。", "**M2（第 2 波末）**：\"我先建评测再升级\"——golden set + 检索基线两份带数字的报告。", "**M3（第 3+4 波末）**：\"完整的工业级 LLM 网关 + 混合检索 + 受限 agent 环\"——TTFT/成本/召回三组前后对比数字。", "**M4（第 5 波末）**：\"故障注入下不丢不重\"——outbox/停机/多 worker 测试回执。", "**M5（第 6 波末）**：\"测量系统自己也被测量\"——judge 一致率、画像信效度、灰度守护。"]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const {items, waves, deps, miles} = DATA;
const BY_ID = Object.fromEntries(items.map(i=>[i.id,i]));
const KEY = 'careerpilot-known-issues-v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
const st = id => (store[id] && store[id].status) || (BY_ID[id] ? BY_ID[id].status : 'OPEN');
const isDone = id => ['DONE','ACCEPTED'].includes(st(id));
const S_LABEL = {OPEN:'未动',IN_PROGRESS:'进行中',DONE:'完成',ACCEPTED:'接受'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
// 从轨道 ids 单元格提取有序 ID 序列（保留 → 串行关系）
function idSeq(cell){
  const plain = cell.replace(/\*\*/g,'');
  const parts = plain.split(/→/).map(s=>s.trim());
  return parts.map(p=>{
    const m = p.match(/([A-J]\d+)/);
    return m ? {id:m[1], label:p} : null;
  }).filter(Boolean);
}
// 工时估算（天）：从波次标题提取，缺省 7
function waveDays(title){
  const m = title.match(/≈\s*([\d.]+)(?:–([\d.]+))?\s*(天|周)/);
  if(!m) return 7;
  const lo = parseFloat(m[1]), hi = m[2]?parseFloat(m[2]):lo;
  const mid = (lo+hi)/2;
  return m[3]==='周' ? mid*5 : mid;
}
function render(){
  // 统计
  const total = items.length, done = items.filter(i=>isDone(i.id)).length;
  document.getElementById('stats').textContent = `总进度 ${done}/${total}`;
  // 甘特
  const days = waves.map(w=>waveDays(w.title));
  const totalDays = days.reduce((a,b)=>a+b,0);
  let acc = 0, gh = '';
  waves.forEach((w,idx)=>{
    const ids = [...new Set(w.tracks.flatMap(t=>idSeq(t.ids).map(x=>x.id)))].filter(id=>BY_ID[id]);
    const d = ids.filter(isDone).length;
    const left = 100*acc/totalDays, width = 100*days[idx]/totalDays;
    const fill = ids.length ? 100*d/ids.length : 0;
    const short = w.title.split('·')[0].trim() + ' ' + (w.title.split('·')[1]||'').split('（')[0].trim();
    gh += `<div class="grow"><div class="glabel">${esc(short)}</div>
      <div class="gtrack"><div class="gbar" style="left:${left}%;width:${width}%">
      <div class="fill" style="width:${fill}%"></div><span>${d}/${ids.length} · ≈${days[idx]}天</span></div></div></div>`;
    acc += days[idx];
  });
  document.getElementById('gantt').innerHTML = gh;
  let ax = '', cum = 0;
  waves.forEach((w,idx)=>{cum+=days[idx];ax+=`<div style="flex:${days[idx]}">第${idx}波末 ≈${Math.round(cum)}天</div>`;});
  document.getElementById('gaxis').innerHTML = ax;
  // 时间线
  let h = '';
  let firstOpen = true;
  waves.forEach((w,idx)=>{
    const ids = [...new Set(w.tracks.flatMap(t=>idSeq(t.ids).map(x=>x.id)))].filter(id=>BY_ID[id]);
    const d = ids.filter(isDone).length;
    const complete = ids.length>0 && d===ids.length;
    const active = !complete && firstOpen;
    if(!complete) firstOpen = false;
    const pct = ids.length ? 100*d/ids.length : 0;
    h += `<div class="wave ${complete?'complete':''} ${active?'active':''}">
      <div class="wtitle">${esc(w.title)}</div>
      <div class="wmeta">${ids.length} 项 · 完成 ${d} · ${w.tracks.length} 条轨道${active?' · ⬅ 当前应开工':''}</div>
      <div class="wprog"><div style="width:${pct}%"></div></div>
      <div class="tracks">`;
    for(const t of w.tracks){
      const serial = t.track.includes('串行');
      const seq = idSeq(t.ids);
      let chips = '';
      seq.forEach((x,i)=>{
        if(i>0) chips += '<span class="arrow">→</span>';
        const it = BY_ID[x.id];
        const s = st(x.id);
        const pr = it ? it.priority : 'P2';
        const title = it ? it.title : x.label;
        chips += `<a class="item-link ${isDone(x.id)?'done':''}" href="index.html#card-${x.id}" title="${esc(title)}">
          <span class="badge ${pr}">${x.id}</span><span class="st ${s}">${S_LABEL[s]||s}</span></a>`;
      });
      h += `<div class="track ${serial?'serial':''}">
        <div class="thead"><span class="tname">${esc(t.track.replace(/`\[串行\]`/,'').trim())}</span>
          <span class="${serial?'serial-tag':'parallel-tag'}">${serial?'轨道内串行':'可并行'}</span></div>
        <div class="tids">${chips}</div>
        <div class="twork">${inline(t.work)}</div>
        <div class="tdep"><b>依赖</b> ${inline(t.dep)}</div>
      </div>`;
    }
    h += '</div>';
    if(w.notes.length){
      h += '<div class="wnotes">' + w.notes.map(n=>`<p>${inline(n)}</p>`).join('') + '</div>';
    }
    h += '</div>';
  });
  document.getElementById('timeline').innerHTML = h;
  document.getElementById('deps').innerHTML =
    deps.map(d=>`<div class="dep-line">${inline(d)}</div>`).join('');
  document.getElementById('miles').innerHTML =
    miles.map(m=>`<div class="mile">${inline(m)}</div>`).join('');
}
render();
</script>
